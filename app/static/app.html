<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Uvar.si</title>
<meta name="theme-color" content="#FFD400">
<link rel="manifest" href="/static/manifest.json">
<link rel="preload" as="font" type="font/woff2" href="/static/fonts/manrope-400-800.7101939e.woff2" crossorigin>
<link rel="preload" as="font" type="font/woff2" href="/static/fonts/anton-400.6d2997e3.woff2" crossorigin>
<style>
/* Písma si servírujeme sami: prvé vykreslenie už nečaká na cudzí DNS a TLS
   a IP návštevníka neodchádza tretej strane. Subset a licencia:
   /static/fonts/LICENSE.txt */
@font-face{font-family:"Anton";font-style:normal;font-weight:400;font-display:swap;
  src:url("/static/fonts/anton-400.6d2997e3.woff2") format("woff2")}
@font-face{font-family:"IBM Plex Mono";font-style:normal;font-weight:400;font-display:swap;
  src:url("/static/fonts/ibmplexmono-400.c55d055f.woff2") format("woff2")}
@font-face{font-family:"IBM Plex Mono";font-style:normal;font-weight:600;font-display:swap;
  src:url("/static/fonts/ibmplexmono-600.f4faf2fe.woff2") format("woff2")}
@font-face{font-family:"Manrope";font-style:normal;font-weight:400 800;font-display:swap;
  src:url("/static/fonts/manrope-400-800.7101939e.woff2") format("woff2")}
:root{--paper:#FFFCF5;--paper-2:#F7F1E3;--ink:#14231C;--ink-soft:#5C6B62;
  --yellow:#FFD400;--red:#E23A26;--green:#1F7A4C;--line:#E4DED0}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:var(--paper);color:var(--ink);font-family:"Manrope",system-ui,sans-serif;
  line-height:1.55;padding-bottom:78px}
.display{font-family:"Anton",sans-serif;font-weight:400;text-transform:uppercase;line-height:1}
.mono{font-family:"IBM Plex Mono",monospace}
.wrap{max-width:640px;margin:0 auto;padding:0 18px}
header{position:sticky;top:0;background:var(--paper);border-bottom:2px solid var(--ink);
  padding:14px 0;z-index:20}
.brand{font-family:"Anton",sans-serif;font-size:1.3rem;letter-spacing:.04em;text-transform:uppercase}
.brand em{font-style:normal;color:var(--red)}
.btn{font-family:"IBM Plex Mono",monospace;font-weight:600;letter-spacing:.05em;
  text-transform:uppercase;font-size:.84rem;padding:15px 20px;border:2px solid var(--ink);
  background:var(--yellow);color:var(--ink);cursor:pointer;display:block;width:100%;
  box-shadow:3px 3px 0 var(--ink);text-align:center;text-decoration:none}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.btn--ghost{background:transparent;box-shadow:none}
input,select{width:100%;padding:14px;border:2px solid var(--ink);background:#fff;
  font-family:"IBM Plex Mono",monospace;font-size:1rem;color:var(--ink)}
label{font-family:"IBM Plex Mono",monospace;font-size:.76rem;font-weight:600;
  letter-spacing:.1em;text-transform:uppercase;color:var(--ink-soft);display:block;margin-bottom:7px}
.card{background:#fff;border:2px solid var(--ink);padding:18px;margin-bottom:14px}
.eyebrow{font-family:"IBM Plex Mono",monospace;font-size:.7rem;font-weight:600;
  letter-spacing:.14em;text-transform:uppercase;color:var(--red)}
.muted{color:var(--ink-soft);font-size:.9rem}
.center{text-align:center}
.hidden{display:none!important}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{font-family:"IBM Plex Mono",monospace;font-size:.8rem;font-weight:600;padding:11px 15px;
  border:2px solid var(--ink);background:#fff;cursor:pointer}
.chip.on{background:var(--yellow)}
/* plán */
.meal{border:2px solid var(--ink);background:#fff;margin-bottom:12px}
.meal-h{display:flex;align-items:center;gap:12px;padding:15px;cursor:pointer}
.meal-d{font-family:"Anton",sans-serif;font-size:1.5rem;color:var(--yellow);
  -webkit-text-stroke:1.5px var(--ink);min-width:42px}
.meal-n{font-weight:800;font-size:1.02rem;line-height:1.25;flex:1}
.meal-b{border-top:2px dashed var(--line);padding:15px;display:none}
.meal.open .meal-b{display:block}
.ing{display:flex;justify-content:space-between;gap:10px;font-family:"IBM Plex Mono",monospace;
  font-size:.82rem;padding:7px 0;border-bottom:1px dashed var(--line)}
.ing .r{white-space:nowrap;font-weight:600}
.ing .off{color:var(--red);margin-left:7px}
/* pôvod ceny — tichý riadok pod surovinou, aby sa dala cena skontrolovať */
.ing-b{border-bottom:1px dashed var(--line)}
.ing-b .ing{border-bottom:0;padding-bottom:2px}
.prov{display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 10px;font-family:"IBM Plex Mono",monospace;
  font-size:.68rem;line-height:1.45;color:var(--ink-soft);padding:0 0 8px}
.prov a{color:var(--ink-soft);text-decoration:underline;text-underline-offset:2px}
.prov a:active{color:var(--ink)}
.prov .vld--dnes,.prov .vld--zajtra,.prov .vld--neplatna{color:var(--red);font-weight:600}
.ing--neplatna .r{color:var(--ink-soft);text-decoration:line-through}
.steps{list-style:none;counter-reset:s;margin-top:14px}
.steps li{counter-increment:s;position:relative;padding-left:28px;margin-bottom:11px;font-size:.94rem}
.steps li::before{content:counter(s) ".";position:absolute;left:0;color:var(--red);
  font-weight:700;font-family:"IBM Plex Mono",monospace}
.rest{font-style:italic;color:var(--ink-soft);font-size:.88rem;padding:9px 15px;
  border:2px dashed var(--line);margin-bottom:12px}
/* voľný deň — nikdy tichá diera v týždni, vždy viditeľný riadok */
.rest--volno{font-style:normal;border-style:dotted}
.hint{background:var(--paper-2);border:2px dashed var(--ink);padding:16px;margin-bottom:14px}
.save{display:flex;justify-content:space-between;align-items:baseline;background:var(--yellow);
  border:2px solid var(--ink);padding:14px;margin:16px 0}
.save b{font-family:"Anton",sans-serif;font-weight:400;font-size:1.7rem}
/* nákupný zoznam */
.shop-h{font-family:"Anton",sans-serif;font-size:1.1rem;text-transform:uppercase;
  background:var(--ink);color:var(--paper);padding:9px 14px;margin-top:14px}
.item{display:flex;align-items:center;gap:12px;padding:13px 14px;border:2px solid var(--ink);
  border-top:0;background:#fff;cursor:pointer}
.item.done{opacity:.45;text-decoration:line-through}
.box{width:22px;height:22px;border:2px solid var(--ink);flex-shrink:0;display:grid;place-items:center;
  font-weight:800;font-size:.9rem}
.item.done .box{background:var(--green);color:#fff}
.item .nm{flex:1;font-size:.94rem}
.item .pr{font-family:"IBM Plex Mono",monospace;font-weight:600;font-size:.86rem;white-space:nowrap}
/* položka zo špajze — nie je odškrtnutá, je odložená nabok a jedno ťuknutie
   ju vráti do nákupu */
.item--doma{background:var(--paper-2);cursor:default}
.item--doma .nm,.item--doma .pr{color:var(--ink-soft)}
.undo{display:block;font-family:"IBM Plex Mono",monospace;font-size:.68rem;font-weight:600;
  text-decoration:underline;cursor:pointer;color:var(--ink)}
.item .doma-note{display:block;font-family:"IBM Plex Mono",monospace;font-size:.68rem}
/* dávky receptu — koľko čoho sa naozaj použije, nie koľko sa kupuje */
.davky{margin:10px 0 2px;color:var(--ink-soft)}
/* nav */
nav{position:fixed;bottom:0;left:0;right:0;background:var(--paper);border-top:2px solid var(--ink);
  display:flex;z-index:30;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;background:none;border:0;padding:11px 4px;font-family:"IBM Plex Mono",monospace;
  font-size:.64rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;
  color:var(--ink-soft);cursor:pointer}
nav button.on{color:var(--ink)}
nav .ico{display:block;font-size:1.25rem;margin-bottom:2px}
.spin{width:34px;height:34px;border:3px solid var(--line);border-top-color:var(--red);
  border-radius:50%;animation:sp .8s linear infinite;margin:34px auto}
@keyframes sp{to{transform:rotate(360deg)}}
.tag{display:inline-block;font-family:"IBM Plex Mono",monospace;font-size:.68rem;font-weight:600;
  background:var(--yellow);border:1.5px solid var(--ink);padding:2px 7px;margin-left:6px}
</style>
</head>
<body>

<header><div class="wrap" style="display:flex;justify-content:space-between;align-items:center">
  <span class="brand">Uvar<em>.si</em></span>
  <span id="hdr" class="mono" style="font-size:.72rem;color:var(--ink-soft)"></span>
</div></header>

<main class="wrap" id="main"><div class="spin"></div></main>

<nav id="nav" class="hidden">
  <button data-t="plan" class="on"><span class="ico">🍽️</span>Plán</button>
  <button data-t="zoznam"><span class="ico">🛒</span>Nákup</button>
  <button data-t="spajza"><span class="ico">🥫</span>Špajza</button>
  <button data-t="nastavenia"><span class="ico">⚙️</span>Ja</button>
</nav>

<script>
const $ = s => document.querySelector(s);
const M = $('#main');
let ME = null, PLAN = null, TAB = 'plan';
let APP_READY = false;
let DONE = {};
/* Zhody so špajzou, ktoré používateľ zrušil („predsa to kúpim"). Párovanie
   voľného textu na názvy z letáku je odhad; keď sa netrafí, musí sa dať vrátiť
   jedným ťuknutím — a to rozhodnutie musí prežiť prekreslenie aj zatvorenie. */
let PANTRY_OVERRIDE = {};
let PANTRY_HINT_HIDDEN = false;
let PANTRY_ACCESS_CHANGED = false;
/* Odpoveď servera na vyžiadaný prepočet — ukáže sa nad jedálničkom, nezmaže ho. */
let PLAN_NOTE = '';
let PLAN_NEEDS_REGEN = false;
let PLAN_RESUME_ENDPOINT = '';
let PLAN_EMPTY_REASON = '';
/* Suroviny v ukážke: zámerne bežné veci, vždy označené ako ukážka. */
const SPAJZA_UKAZKA = ['ryža', 'vajcia', 'cibuľa'];
/* Bežné regálové ceny, nech je v ukážke vidieť, o koľko nákup klesne. */
const SPAJZA_UKAZKA_CENY = {'ryža': '1,29', 'vajcia': '2,49', 'cibuľa': '0,89'};
/* Jediné dlhé volanie. Bez stropu by sa koliesko točilo donekonečna; server
   má 120 s, klient necháva rezervu na sieť. */
const PLAN_TIMEOUT_MS = 150000;
const PLAN_TIMEOUT_TEXT = 'Jedálniček sa nestihol poskladať do dvoch a pol minúty. Skús to prosím znova.';

function startupRequests(request) {
  return {me: request('/api/me'), plan: request('/api/plan')};
}

let STARTUP = null, PLAN_PREFETCH = null;

function beginStartup() {
  STARTUP = startupRequests(url =>
    fetch(url, {headers: {'Content-Type': 'application/json'}}));
  STARTUP.me.catch(() => {});
  STARTUP.plan.catch(() => {});
  PLAN_PREFETCH = STARTUP.plan;
  return STARTUP;
}

beginStartup();
function takePlanPrefetch() {
  const pending = PLAN_PREFETCH;
  PLAN_PREFETCH = null;
  return pending;
}

const PROFILE_KEY = 'uvarsi_profil';

function rememberProfile(me) {
  try {
    localStorage.setItem(PROFILE_KEY, JSON.stringify({
      email: me.email, osoby: me.osoby, frekvencia: me.frekvencia,
      obchody: me.obchody, onboarding: !!me.onboarding}));
  } catch (e) {}
}

function forgetProfile() {
  try { localStorage.removeItem(PROFILE_KEY); } catch (e) {}
}

function cachedProfile() {
  try {
    const known = JSON.parse(localStorage.getItem(PROFILE_KEY) || 'null');
    return known && known.email && known.onboarding ? known : null;
  } catch (e) { return null; }
}

function paintKnownShell() {
  const known = cachedProfile();
  if (!known) return false;
  $('#hdr').textContent = String(known.email).split('@')[0];
  showNav();
  setNavigationReady(false);
  return true;
}

function checkedStateKey(user, plan) {
  var identity = user && (user.id || user.email);
  var week = plan && plan.tyzden;
  var parts = [String(week || 'unknown')];
  var groups = (plan && plan.nakupny_zoznam) || [];
  for (var g = 0; g < groups.length; g++) {
    var group = groups[g] || {};
    parts.push(String(group.obchod || ''));
    var items = group.polozky || [];
    for (var i = 0; i < items.length; i++) {
      var item = items[i] || {};
      parts.push(String(item.offer_key || item.nazov || ''));
    }
  }
  var signature = parts.join('|');
  var fingerprint = 2166136261;
  for (var c = 0; c < signature.length; c++) {
    fingerprint = (fingerprint ^ signature.charCodeAt(c)) >>> 0;
    fingerprint = (fingerprint + ((fingerprint << 1) + (fingerprint << 4) +
      (fingerprint << 7) + (fingerprint << 8) + (fingerprint << 24))) >>> 0;
  }
  return 'uvarsi_done:' + encodeURIComponent(String(identity || 'unknown')) + ':' +
    encodeURIComponent(String(week || 'unknown')) + ':' + fingerprint.toString(36);
}

function loadCheckedState(user, plan) {
  try { return JSON.parse(localStorage.getItem(checkedStateKey(user, plan)) || '{}'); }
  catch(e) { return {}; }
}

function setPlan(plan) {
  PLAN = plan;
  if (plan && plan.jedla) {
    PLAN_NEEDS_REGEN = false;
    PLAN_RESUME_ENDPOINT = '';
    PLAN_EMPTY_REASON = '';
  }
  DONE = loadCheckedState(ME, PLAN);
  PANTRY_OVERRIDE = loadPantryOverride(ME, PLAN);
}

/* ---------- špajza nad nákupným zoznamom ----------
   Server označí, čo už používateľ doma má, a povie, ktorá položka špajze sa
   naň chytila. Párovanie voľného textu nie je neomylné, preto sa tu nič
   nemaže: položka je len odložená a jedno ťuknutie ju vráti do nákupu. */
function pantryOverrideKey(user, plan) {
  return 'uvarsi_kupim:' + checkedStateKey(user, plan).slice(12);
}

function loadPantryOverride(user, plan) {
  try { return JSON.parse(localStorage.getItem(pantryOverrideKey(user, plan)) || '{}'); }
  catch(e) { return {}; }
}

function pantryOwned(item, overrides) {
  if (!item || !item.mas_doma) return false;
  return !(overrides || {})[String(item.offer_key || item.nazov || '')];
}

function moneyValue(text) {
  var amount = Number(String(text == null ? '' : text).replace(',', '.'));
  return isFinite(amount) ? amount : 0;
}

function moneyText(amount) {
  return (isFinite(Number(amount)) ? Number(amount) : 0).toFixed(2).replace('.', ',');
}

function shoppingItems(plan) {
  var groups = (plan && plan.nakupny_zoznam) || [];
  var out = [];
  for (var g = 0; g < groups.length; g++) {
    out = out.concat((groups[g] || {}).polozky || []);
  }
  return out;
}

/* Koľko sa po odrátaní špajze naozaj zaplatí. Ráta sa na klientovi, lebo
   zrušenie zhody nesmie čakať na server — číslo musí sedieť okamžite. */
function remainingTotal(plan, overrides) {
  return moneyText(shoppingItems(plan).reduce(function(sum, item) {
    return pantryOwned(item, overrides) ? sum : sum + moneyValue(item.cena);
  }, 0));
}

function pantryOwnedCount(plan, overrides) {
  return shoppingItems(plan).filter(function(item) {
    return pantryOwned(item, overrides);
  }).length;
}

function itemsWord(count) {
  return count === 1 ? 'položku' : count < 5 ? 'položky' : 'položiek';
}

function shoppingQuantityLabel(item) {
  var quantity = item && item.mnozstvo;
  var unit = item && item.jednotka;
  return quantity && unit ? String(quantity) + ' × ' + String(unit) : '';
}

function clearAuthenticatedState() {
  ME = null;
  PLAN = null;
  DONE = {};
  $('#hdr').textContent = '';
}

function handleApiUnauthorized(response) {
  if (!response || response.status !== 401) return false;
  clearAuthenticatedState();
  viewLogin();
  return true;
}

function apiErrorMessage(status, payload) {
  var detail = payload && payload.detail;
  if (Object.prototype.toString.call(detail) === '[object Array]') {
    var reasons = [];
    for (var i = 0; i < detail.length; i++) {
      var entry = detail[i];
      var reason = typeof entry === 'string' ? entry : (entry && (entry.msg || entry.message)) || '';
      if (reason) reasons.push(String(reason));
    }
    detail = reasons.join(' · ');
  } else if (detail && typeof detail === 'object') {
    detail = detail.msg || detail.message || '';
  }
  if (typeof detail === 'string' && detail.replace(/\s/g, '')) {
    detail = detail.trim();
    return /[.!?…]$/.test(detail) ? detail : detail + '.';
  }
  if (status === 422 || status === 400) return 'Zadané údaje nesedia. Skontroluj ich a skús to znova.';
  if (status === 404) return 'Toto sa nenašlo. Skús to znova alebo napíš na pomoc@uvar.si.';
  if (status === 429) return 'Priveľa pokusov za sebou. Skús to prosím o minútu.';
  if (status >= 500) return 'Server má krátkodobý problém. Skús to prosím o chvíľu znova.';
  return 'Niečo sa pokazilo. Skús to prosím znova.';
}

function networkErrorMessage(online) {
  return online === false
    ? 'Vyzerá to, že si offline. Zapni internet a skús to znova.'
    : 'Nepodarilo sa spojiť so serverom. Skontroluj pripojenie a skús to znova.';
}

function offlineError() {
  const failure = new Error(networkErrorMessage(
    typeof navigator === 'undefined' ? true : navigator.onLine));
  failure.offline = true;
  return failure;
}

/* Spoločné vyhodnotenie odpovede: api() aj predbežná požiadavka zo štartu. */
async function readApiResponse(r) {
  if (handleApiUnauthorized(r)) {
    const authError = new Error('Prihlásenie vypršalo. Prihlás sa znova.');
    authError.authRequired = true;
    throw authError;
  }
  if (!r.ok) {
    const payload = await r.json().catch(()=>null);
    const failure = new Error(apiErrorMessage(r.status, payload));
    failure.status = r.status;
    const serverCode = payload && (payload.kod || payload.code);
    failure.code = typeof serverCode === 'string' ? serverCode.slice(0,100) : '';
    throw failure;
  }
  return r.json();
}

async function readStartupResponse(pending) {
  let r;
  try { r = await pending; }
  catch (networkFailure) { throw offlineError(); }
  return readApiResponse(r);
}

async function api(url, opts) {
  const options = Object.assign({headers:{'Content-Type':'application/json'}}, opts||{});
  const limit = options.timeoutMs;
  delete options.timeoutMs;
  let controller = null, timer = null;
  if (limit && typeof AbortController !== 'undefined') {
    controller = new AbortController();
    options.signal = controller.signal;
    timer = setTimeout(() => controller.abort(), limit);
  }
  let r;
  try {
    r = await fetch(url, options);
  } catch (networkError) {
    if (controller && controller.signal.aborted) {
      const timeoutError = new Error(PLAN_TIMEOUT_TEXT);
      timeoutError.timeout = true;
      throw timeoutError;
    }
    throw offlineError();
  } finally {
    if (timer) clearTimeout(timer);
  }
  return readApiResponse(r);
}

async function runGuardedAction(button, errorNode, action) {
  if (!button || button.disabled) return false;
  const label = button.textContent;
  if (errorNode) errorNode.textContent = '';
  button.disabled = true;
  button.textContent = 'Pracujem…';
  try {
    await action();
    return true;
  } catch (error) {
    button.disabled = false;
    button.textContent = label;
    if (error && error.authRequired) return false;
    const message = (error && error.message) || 'Nepodarilo sa to uložiť. Skús to prosím znova.';
    if (errorNode) errorNode.textContent = message; else alert(message);
    return false;
  }
}

function pantryUnlocked(me) {
  if (!me) return false;
  if (typeof me.spajza_dostupna === 'boolean') return me.spajza_dostupna;
  if (typeof me.spajza_premium === 'boolean') return me.spajza_premium;
  return !!me.premium;
}

function pantryDiffers(planPantry, currentPantry) {
  if (Object.prototype.toString.call(planPantry) !== '[object Array]') return false;
  var tidy = function(list) {
    var out = [];
    var source = Object.prototype.toString.call(list) === '[object Array]' ? list : [];
    for (var i = 0; i < source.length; i++) {
      var name = String(source[i] == null ? '' : source[i]).trim().toLowerCase();
      if (name) out.push(name);
    }
    return out.sort();
  };
  var before = tidy(planPantry), now = tidy(currentPantry);
  if (before.length !== now.length) return true;
  for (var i = 0; i < before.length; i++) if (before[i] !== now[i]) return true;
  return false;
}

/* ---------- týždeň ----------
   Každý deň musí mať riadok: navarené, zvyšok alebo výslovné voľno. Z pevného
   zoznamu dní dni mimo neho ticho zmizli. */
function dayGenitive(day) {
  var forms = {'PO':'pondelka', 'UT':'utorka', 'ST':'stredy', 'ŠT':'štvrtka',
    'PI':'piatku', 'SO':'soboty', 'NE':'nedele'};
  var key = String(day == null ? '' : day);
  return Object.prototype.hasOwnProperty.call(forms, key) ? forms[key] : 'predošlého dňa';
}

function planWeekDays(plan, frequency) {
  var dni = ['PO', 'UT', 'ST', 'ŠT', 'PI', 'SO', 'NE'];
  var meals = (plan && plan.jedla) || [];
  var map = {};
  for (var m = 0; m < meals.length; m++) if (meals[m] && meals[m].den) map[meals[m].den] = meals[m];
  var span = Math.round(Number(frequency));
  if (!isFinite(span) || span < 1) span = 1;
  if (span > 7) span = 7;
  var rows = [], cooked = null, since = 0;
  for (var i = 0; i < dni.length; i++) {
    var den = dni[i];
    if (map[den]) { cooked = den; since = 0; rows.push({den: den, typ: 'jedlo', jedlo: map[den]}); continue; }
    since += 1;
    if (cooked && since <= span - 1) rows.push({den: den, typ: 'zvysok', zdroj: cooked});
    else rows.push({den: den, typ: 'volno'});
  }
  return rows;
}

/* ---------- čakanie na plán ----------
   Skladanie trvá 60–120 s. Bez slova o tom, čo sa deje, to vyzerá zamrznuto. */
function planWaitMessage(seconds) {
  var s = Math.max(0, Math.floor(Number(seconds) || 0));
  if (s < 20) return 'Čítam letáky z tvojich obchodov…';
  if (s < 60) return 'Skladám jedlá tak, aby ti suroviny nezostali navyše…';
  if (s < 120) return 'Dopočítavam ceny a nákupný zoznam…';
  return 'Trvá to dlhšie ako zvyčajne. Ešte chvíľu to skúšam…';
}

function planWaitFootnote(seconds) {
  var s = Math.max(0, Math.floor(Number(seconds) || 0));
  var minutes = Math.floor(s / 60), rest = s % 60;
  return 'Beží ' + minutes + ':' + (rest < 10 ? '0' : '') + rest +
    ' · zvyčajne to trvá 60 až 120 sekúnd';
}

function planProgressHtml(seconds) {
  return `<div class="spin"></div>
    <p class="center mono" style="font-size:.82rem;font-weight:600">${esc(planWaitMessage(seconds))}</p>
    <p class="center muted mono" style="font-size:.72rem;margin-top:6px">${esc(planWaitFootnote(seconds))}</p>`;
}

function weekLabel(tyzden) {
  var text = String(tyzden == null ? '' : tyzden).trim();
  var parts = /^(\d{4})-(\d{2})-(\d{2})$/.exec(text);
  if (!parts) return text ? 'Týždeň ' + text : 'Aktuálny týždeň';
  return 'Týždeň od ' + Number(parts[3]) + '. ' + Number(parts[2]) + '. ' + parts[1];
}
const esc = s => String(s??'').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ---------- pôvod ceny ----------
   Ku každej surovine chodí leták, strana a platnosť. Bez nich sa sľub
   „skutočné ceny" nedá overiť. */
function isoDay(value) {
  var parts = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(value == null ? '' : value).trim());
  if (!parts) return null;
  return Date.UTC(Number(parts[1]), Number(parts[2]) - 1, Number(parts[3]));
}

function dayMonthLabel(iso) {
  var parts = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(iso == null ? '' : iso).trim());
  return parts ? Number(parts[3]) + '. ' + Number(parts[2]) + '.' : '';
}

function offerValidity(validTo, today) {
  var end = isoDay(validTo), now = isoDay(today);
  if (end === null || now === null) return {stav: 'neznama', text: ''};
  var days = Math.round((end - now) / 86400000);
  if (days < 0) return {stav: 'neplatna', text: 'Cena už neplatí'};
  if (days === 0) return {stav: 'dnes', text: 'Platí len dnes'};
  if (days === 1) return {stav: 'zajtra', text: 'Platí do zajtra'};
  return {stav: 'plati', text: 'Platí do ' + dayMonthLabel(validTo)};
}

function leafletLabel(item) {
  var store = String((item && item.obchod) || '').trim();
  var page = Number(item && item.source_page);
  var parts = [];
  if (store) parts.push('Leták ' + store);
  if (isFinite(page) && page > 0) parts.push('strana ' + page);
  return parts.join(' · ');
}

function sourceHref(url) {
  var text = String(url == null ? '' : url).trim();
  return /^https?:\/\//i.test(text) ? text : '';
}

function todayIso() {
  var now = new Date();
  var pad = n => (n < 10 ? '0' : '') + n;
  return now.getFullYear() + '-' + pad(now.getMonth() + 1) + '-' + pad(now.getDate());
}

function ingredientProvenance(item, today) {
  if (!item || item.spajza || !item.offer_key) return '';
  var validity = offerValidity(item.valid_to, today);
  var href = sourceHref(item.source_url);
  var page = Number(item.source_page);
  var hasPage = isFinite(page) && page > 0;
  /* Starší uložený plán zdroj nemá — vtedy radšej nič, než holé zopakovanie obchodu. */
  if (!validity.text && !href && !hasPage) return '';
  var parts = [];
  var leaflet = leafletLabel(item);
  if (leaflet) parts.push(`<span>${esc(leaflet)}</span>`);
  if (validity.text) parts.push(`<span class="vld vld--${validity.stav}">${esc(validity.text)}</span>`);
  if (href) parts.push(`<a href="${esc(href)}" target="_blank" rel="noopener noreferrer nofollow">Otvoriť leták ↗</a>`);
  return parts.length ? `<div class="prov">${parts.join('')}</div>` : '';
}

function ingredientRow(item, today) {
  if (!item) return '';
  if (item.spajza) {
    return `<div class="ing-b"><div class="ing"><span>${esc(item.spajza)} · zo špajze</span>
      <span class="r"></span></div></div>`;
  }
  var stav = offerValidity(item.valid_to, today).stav;
  return `<div class="ing-b${stav === 'neplatna' ? ' ing--neplatna' : ''}">
    <div class="ing"><span>${esc(item.nazov)}${item.obchod ? ' · ' + esc(item.obchod) : ''}</span>
    <span class="r">${item.cena ? esc(item.cena) + ' €' : ''}${item.zlava ? `<span class="off">${esc(item.zlava)}</span>` : ''}</span></div>
    ${ingredientProvenance(item, today)}</div>`;
}

/* ---------- plán ---------- */
let PLAN_PROGRESS = null;
let PLAN_REQUEST_IN_FLIGHT = null;

function onePlanRequest(request) {
  if (PLAN_REQUEST_IN_FLIGHT) return PLAN_REQUEST_IN_FLIGHT;
  PLAN_REQUEST_IN_FLIGHT = request().finally(() => { PLAN_REQUEST_IN_FLIGHT = null; });
  return PLAN_REQUEST_IN_FLIGHT;
}

function startPlanProgress() {
  stopPlanProgress();
  const zaciatok = Date.now();
  M.innerHTML = planProgressHtml(0);
  PLAN_PROGRESS = setInterval(() => {
    M.innerHTML = planProgressHtml(Math.floor((Date.now() - zaciatok) / 1000));
  }, 1000);
}

function stopPlanProgress() {
  if (PLAN_PROGRESS) { clearInterval(PLAN_PROGRESS); PLAN_PROGRESS = null; }
}

function generujPlan() {
  return onePlanRequest(() =>
    api('/api/plan/generuj', {method:'POST', timeoutMs: PLAN_TIMEOUT_MS}));
}

function preskladajPlan() {
  return onePlanRequest(() =>
    api('/api/plan/generuj?force=1', {method:'POST', timeoutMs: PLAN_TIMEOUT_MS}));
}

/* Koľko pokusov dnes zostáva. Keď server mlčí, je to null — „neviem" nie je
   „nula" a tlačidlo vtedy ostáva tam, kde bolo. */
function regenerationsLeft(me) {
  var raw = me ? me.zostava_prepoctov : null;
  if (typeof raw !== 'number' && typeof raw !== 'string') return null;
  var left = Math.round(Number(raw));
  return isFinite(left) && String(raw).trim() ? Math.max(0, left) : null;
}

/* Strop sa vracia o polnoci — nech je napísané, ktorý deň. */
function nextDayLabel(today) {
  var base = isoDay(today);
  if (base === null) return 'zajtra';
  var next = new Date(base + 86400000);
  return 'zajtra ' + next.getUTCDate() + '. ' + (next.getUTCMonth() + 1) + '.';
}

/* Vyčerpaný strop je bežný stav, nie chyba: koľko, dokedy a že jedálniček
   zostáva. Znenie sedí s tým, čo na to isté odpovedá server. */
function regenerationBlockedNote(me, today) {
  var limit = Math.round(Number(me && me.limit_prepoctov));
  var kolko = isFinite(limit) && limit > 0
    ? (limit === 1 ? 'raz za deň' : limit + '× za deň') : '';
  var text = kolko
    ? 'Nový jedálniček ide ' + kolko + ' a dnešok už máš vyčerpaný.'
    : 'Nový jedálniček dnes už nejde.';
  text += ' Ďalší si vyžiadaj ' + nextDayLabel(today) +
    ' po polnoci — ten, ktorý máš teraz, ti zostáva.';
  if (!(me && me.premium)) text += ' S Premium je to 5× denne.';
  return text;
}

/* Koľko nových jedálničkov dnes ešte ide — aby strop nebol prekvapením. */
function regenerationNote(me) {
  var limit = Math.round(Number(me && me.limit_prepoctov));
  if (!isFinite(limit) || limit <= 0) return '';
  var left = Math.round(Number(me && me.zostava_prepoctov));
  if (!isFinite(left) || left < 0) left = 0;
  return 'Nový jedálniček: dnes ešte ' + Math.min(left, limit) + ' z ' + limit;
}

/* Výslovné „navrhni jedlá z toho, čo mám doma". Jediná cesta, ktorou špajza
   ovplyvní JEDLÁ; inak sa dotýka len nákupného zoznamu. Je to platené volanie,
   preto sa spúšťa len na kliknutie a berie jeden prepočet z denného stropu. */
function planZoSpajze() {
  return onePlanRequest(() =>
    api('/api/plan/zo-spajze', {method:'POST', timeoutMs: PLAN_TIMEOUT_MS}));
}

async function navrhniZoSpajze() {
  TAB = 'plan';
  if (regenerationsLeft(ME) === 0) {
    PLAN_NOTE = regenerationBlockedNote(ME, todayIso());
    return render();
  }
  startPlanProgress();
  try {
    setPlan(await planZoSpajze());
    PLAN_NOTE = '';
    PANTRY_HINT_HIDDEN = true;
    try { ME = await api('/api/me'); } catch (ignored) {}
  } catch (error) {
    if (error && error.authRequired) { stopPlanProgress(); return; }
    PLAN_NOTE = (error && error.message) ||
      'Jedálniček zo špajze sa teraz nepodaril. Skús to prosím znova.';
  }
  stopPlanProgress();
  render();
}

/* Server posiela recept.davky, recept.pre a recept.porcie od začiatku;
   obrazovka ich zamlčiavala, takže z jedla nebolo vidieť, na koľko dní sa varí. */
function portionLine(recept) {
  if (!recept) return '';
  var parts = [];
  var portions = Math.round(Number(recept.porcie));
  if (isFinite(portions) && portions > 0) {
    var word = portions === 1 ? 'porcia' : portions < 5 ? 'porcie' : 'porcií';
    parts.push(portions + ' ' + word);
  }
  var forWhom = String(recept.pre == null ? '' : recept.pre).trim();
  if (forWhom) parts.push('pre ' + forWhom);
  return parts.join(' · ');
}

/* Prepočet na vyžiadanie. Keď server odmietne, jedálniček zostáva a hláška je
   nad ním — nikdy prázdna chybová stena. */
async function novyPlan() {
  if (!PLAN || !PLAN.jedla) return nacitajPlan(true);
  /* Keď dnes už nič nejde, povie sa to rovno — bez volania do odmietnutia. */
  if (regenerationsLeft(ME) === 0) {
    PLAN_NOTE = regenerationBlockedNote(ME, todayIso());
    return render();
  }
  startPlanProgress();
  try {
    setPlan(await preskladajPlan());
    PLAN_NOTE = '';
    try { ME = await api('/api/me'); } catch (ignored) {}
  } catch (error) {
    if (error && error.authRequired) { stopPlanProgress(); return; }
    PLAN_NOTE = (error && error.message) || 'Nový jedálniček sa teraz nepodaril. Skús to prosím znova.';
  }
  stopPlanProgress();
  render();
}

async function nacitajPlan(gen) {
  if (gen) startPlanProgress();
  else M.innerHTML = `<div class="spin"></div><p class="center muted mono" style="font-size:.8rem">Načítavam…</p>`;
  try {
    /* Pri prvom otvorení je plán už na ceste zo štartu — netreba druhú obrátku. */
    const prefetched = gen ? null : takePlanPrefetch();
    let plan = gen ? await generujPlan()
      : (prefetched ? await readStartupResponse(prefetched) : await api('/api/plan'));
    if (plan.prazdny && plan.vyzaduje_akciu) {
      setPlan(null);
      PLAN_NEEDS_REGEN = true;
      PLAN_RESUME_ENDPOINT = plan.obnovit_cez || '/api/plan/generuj';
      stopPlanProgress();
      return render();
    }
    if (plan.prazdny) { startPlanProgress(); plan = await generujPlan(); }
    stopPlanProgress();
    setPlan(plan);
  } catch(e) {
    stopPlanProgress();
    if (e.authRequired) return;
    showNav();
    M.innerHTML = `<div class="card center" style="margin-top:30px">
      <span class="eyebrow">${e.timeout?'Skladanie trvalo pridlho':'Plán sa nepodaril'}</span>
      <p style="margin-top:8px">${esc(e.message)}</p><div style="height:14px"></div>
      <button class="btn" onclick="nacitajPlan(true)">Skúsiť znova</button>
      <div style="height:10px"></div>
      <button class="btn btn--ghost" id="plan-err-nast">Zmeniť obchody v nastaveniach</button>
      <div style="height:10px"></div>
      <button class="btn btn--ghost" id="plan-err-spajza">Otvoriť špajzu</button>
      <p class="muted" style="margin-top:12px;font-size:.82rem">Dole v menu sa dostaneš aj na Špajzu a na Ja.</p>
      </div>`;
    $('#plan-err-nast').onclick = () => { TAB = 'nastavenia'; render(); };
    $('#plan-err-spajza').onclick = () => { TAB = 'spajza'; render(); };
    return;
  }
  render();
}

async function refreshPlanAfterPantrySave() {
  const plan = await api('/api/plan');
  const empty = !!(plan && plan.prazdny);
  setPlan(empty ? null : plan);
  PLAN_NEEDS_REGEN = empty;
  PLAN_RESUME_ENDPOINT = empty ? (plan.obnovit_cez || '') : '';
  PLAN_EMPTY_REASON = empty ? 'spajza' : '';
  render();
}

async function refreshPlanAfterProfileSave() {
  const plan = await api('/api/plan'), empty = !!(plan && plan.prazdny);
  setPlan(empty ? null : plan);
  PLAN_NEEDS_REGEN = empty;
  PLAN_RESUME_ENDPOINT = empty ? (plan.obnovit_cez || '') : '';
  PLAN_EMPTY_REASON = empty ? 'profil' : '';
  TAB = 'plan';
  render();
}

async function resumeInvalidatedPlan() {
  if (PLAN_RESUME_ENDPOINT === '/api/plan/zo-spajze') return navrhniZoSpajze();
  return nacitajPlan(true);
}

  APP_READY = !!ready;
  [...$('#nav').children].forEach(button => { button.disabled = !APP_READY; });

function vPlan() {
  if (PLAN_NEEDS_REGEN) {
    const profil = PLAN_EMPTY_REASON === 'profil';
    M.innerHTML = `<div class="card center" style="margin-top:30px">
      <span class="eyebrow">${profil?'Nastavenia sa zmenili':'Špajza sa zmenila'}</span>
      <p style="margin:8px 0 14px">${profil

      <button class="btn" onclick="resumeInvalidatedPlan()">Vytvoriť aktuálny jedálniček →</button>
      </div>`;
    return;
  }
  if (!PLAN || !PLAN.jedla) return nacitajPlan(true);
  const dnes = todayIso();
  /* Návrh na prepočet osloví len toho, kto špajzu naozaj má. Na staršom
     serveri bez vlastného poľa o tom rozhoduje ME.premium ako doteraz. */
  const spajzaSaZmenila = !PANTRY_HINT_HIDDEN && pantryUnlocked(ME) &&
    pantryDiffers(PLAN.spajza, ME && ME.spajza);
  let h = `<div style="margin:18px 0 6px"><span class="eyebrow">Tvoj týždeň</span>
    <h1 class="display" style="font-size:1.5rem;margin-top:4px">Navarené z akcií</h1>
    <p class="mono" style="font-size:.74rem;color:var(--ink-soft);margin-top:6px">
      ${esc(weekLabel(PLAN.tyzden))} · ceny odčítané z letákov platných v tomto týždni</p>
    <p class="mono" style="font-size:.7rem;color:var(--ink-soft);margin-top:4px">
      Pri každej surovine je leták, strana a dokedy cena platí — otvor si ho a over si ju.</p></div>`;
  if (PLAN_NOTE) {
    h += `<div class="hint"><p style="margin:0">${esc(PLAN_NOTE)}</p></div>`;
  }
  if (spajzaSaZmenila) {
    h += `<div class="hint" id="sp-hint">
      <span class="eyebrow">Špajza sa zmenila</span>
      <p style="margin:6px 0 4px">Nákupný zoznam to už zarátal. Chceš aj jedlá poskladať
        okolo toho, čo máš doma?</p>
      <p class="muted" style="margin-bottom:12px">Tento jedálniček nechávam tak, ako je,
        kým to nepovieš. Nový sa skladá 60 až 120 sekúnd a berie jeden prepočet.</p>
      <button class="btn" id="sp-hint-go">Navrhni jedlá z toho, čo mám doma →</button>
      <div style="height:8px"></div>
      <button class="btn btn--ghost" id="sp-hint-off">Nechať tak</button></div>`;
  }
  /* Každý deň dostane riadok — navarené, zvyšok alebo výslovné voľno. */
  planWeekDays(PLAN, ME && ME.frekvencia).forEach(row => {
    if (row.typ === 'jedlo') {
      const j = row.jedlo;
      h += `<div class="meal" data-d="${esc(row.den)}"><div class="meal-h">
        <span class="meal-d">${esc(row.den)}</span><span class="meal-n">${esc(j.nazov)}</span>
        <span class="mono" style="font-size:.72rem;color:var(--ink-soft)">${j.recept?.min||''} min ▾</span>
      </div><div class="meal-b">
        ${(j.suroviny||[]).map(s=>ingredientRow(s, dnes)).join('')}
        ${portionLine(j.recept)?`<p class="mono" style="font-size:.72rem;color:var(--ink-soft);margin-top:10px">${esc(portionLine(j.recept))}</p>`:''}
        ${(j.recept?.davky||[]).length?`<div class="davky">${(j.recept?.davky||[]).map(d=>`<div class="d"><span>${esc(d)}</span></div>`).join('')}</div>`:''}
        <ol class="steps">${(j.recept?.kroky||[]).map(k=>`<li>${esc(k)}</li>`).join('')}</ol>
      </div></div>`;
    } else if (row.typ === 'zvysok') {
      h += `<div class="rest">${esc(row.den)} · zvyšok z ${esc(dayGenitive(row.zdroj))}</div>`;
    } else {
      h += `<div class="rest rest--volno">${esc(row.den)} · voľno — nič naplánované</div>`;
    }
  });
  h += `<div class="save"><span class="mono" style="font-size:.8rem;font-weight:600">UŠETRÍŠ</span>
    <b>${esc(PLAN.usetris||'0,00')} €</b></div>
    <p class="muted center mono" style="font-size:.74rem">Nákup ${esc(PLAN.nakup_spolu)} € ·
    bežne ${esc(PLAN.bezne)} €</p>
    <div style="height:14px"></div>`;
  /* Keď pokusy dôjdu, namiesto tlačidla je veta, kedy sa strop vráti. */
  const zostava = regenerationsLeft(ME);
  if (zostava === 0) {
    h += `<div class="hint" id="rg-strop">
      <span class="eyebrow">Nový jedálniček dnes už nejde</span>
      <p style="margin:6px 0 0">${esc(regenerationBlockedNote(ME, dnes))}</p></div>`;
  } else {
    h += `<button class="btn btn--ghost" onclick="novyPlan()">Chcem iný plán ↻</button>
      <p class="muted center mono" style="font-size:.7rem;margin-top:8px">${esc(regenerationNote(ME))}</p>`;
  }
  M.innerHTML = h;
  if (spajzaSaZmenila) {
    $('#sp-hint-go').onclick = () => navrhniZoSpajze();
    $('#sp-hint-off').onclick = () => { PANTRY_HINT_HIDDEN = true; render(); };
  }
  M.querySelectorAll('.meal-h').forEach(el =>
    el.onclick = () => el.parentElement.classList.toggle('open'));
}

function vZoznam() {
  if (!PLAN || !PLAN.nakupny_zoznam) { M.innerHTML = '<p class="muted">Najprv si vygeneruj plán.</p>'; return; }
  const doma = pantryOwnedCount(PLAN, PANTRY_OVERRIDE);
  const zaplatis = remainingTotal(PLAN, PANTRY_OVERRIDE);
  let h = `<div style="margin:18px 0 6px"><span class="eyebrow">Nákupný zoznam</span>
    <h1 class="display" style="font-size:1.5rem;margin-top:4px">Čo kúpiť a kde</h1></div>`;
  /* Zhrnutie špajze: koľko toho netreba kupovať a koľko sa naozaj zaplatí.
     Ráta sa z aktuálnej špajzy pri každom otvorení, nič sa neukladá. */
  if (doma) {
    h += `<div class="hint" id="doma-suhrn"><span class="eyebrow">Zo špajze</span>
      <p style="margin:6px 0 4px">${doma} ${esc(itemsWord(doma))} už máš doma, tak ich
        nekupuješ. Zaplatíš <b>${esc(zaplatis)} €</b> namiesto ${esc(PLAN.nakup_spolu||'')} €.</p>
      <p class="muted" style="margin:0">Keď zhoda nesedí, ťukni na „Predsa kúpiť".</p></div>`;
  }
  PLAN.nakupny_zoznam.forEach((s, si) => {
    h += `<div class="shop-h">${esc(s.obchod)}</div>`;
    (s.polozky||[]).forEach((p, pi) => {
      const k = `${si}-${pi}`;
      const id = String(p.offer_key || p.nazov || '');
      const mnozstvo = shoppingQuantityLabel(p) ? `<span class="tag">${esc(shoppingQuantityLabel(p))}</span>` : '';
      if (pantryOwned(p, PANTRY_OVERRIDE)) {
        h += `<div class="item item--doma">
          <span class="box">🥫</span>
          <span class="nm">${esc(p.nazov)}${mnozstvo}
            <span class="doma-note">máš doma · zo špajze: ${esc(p.spajza || '')}</span></span>
          <span class="pr">${p.cena?esc(p.cena)+' €':''}<br>
            <span class="undo" data-doma="${esc(id)}">Predsa kúpiť</span></span></div>`;
        return;
      }
      h += `<div class="item${DONE[k]?' done':''}" data-k="${k}">
        <span class="box">${DONE[k]?'✓':''}</span>
        <span class="nm">${esc(p.nazov)}${mnozstvo}</span>
        <span class="pr">${p.cena?esc(p.cena)+' €':''}</span></div>`;
    });
  });
  M.innerHTML = h;
  M.querySelectorAll('[data-doma]').forEach(el => el.onclick = event => {
    event.stopPropagation();
    PANTRY_OVERRIDE[el.dataset.doma] = true;
    localStorage.setItem(pantryOverrideKey(ME, PLAN), JSON.stringify(PANTRY_OVERRIDE));
    vZoznam();
  });
  M.querySelectorAll('.item[data-k]').forEach(el => el.onclick = () => {
    const k = el.dataset.k;
    DONE[k] = !DONE[k];
    localStorage.setItem(checkedStateKey(ME, PLAN), JSON.stringify(DONE));
    el.classList.toggle('done'); el.querySelector('.box').textContent = DONE[k] ? '✓' : '';
  });
}

function vSpajzaZamknuta() {
  const platbyIdu = !!(ME && ME.platby_zapnute);
  const uspana = !!(ME && ME.spajza_uspana);
  const ulozenych = Math.max(0, Math.floor(Number(ME && ME.spajza_ulozenych) || 0));
  const uspanaSprava = ME && typeof ME.spajza_sprava === 'string' && ME.spajza_sprava.trim()
    || (ulozenych === 1 ? 'Tvoja 1 uložená položka sa vráti s Premium.'
      : ulozenych < 5 ? `Tvoje ${ulozenych} uložené položky sa vrátia s Premium.`
      : `Tvojich ${ulozenych} uložených položiek sa vráti s Premium.`);
  const tlacidlo = platbyIdu
    ? {popis: 'Chcem Premium →', zamknute: ''}
    : {popis: 'Premium sa zatiaľ nedá kúpiť', zamknute: ' disabled'};
  const poznamka = platbyIdu ? '' :
    `<p class="muted" style="margin-top:10px">Platby ešte nie sú spustené. Keď ich
       zapneme, nájdeš Premium presne tu.</p>`;
  M.innerHTML = `<div style="margin:18px 0 6px"><span class="eyebrow">Špajza · Premium</span>
    <h1 class="display" style="font-size:1.5rem;margin-top:4px">Čo už máš doma</h1>
    ${PANTRY_ACCESS_CHANGED ? '<div class="hint"><b>Prístup k Špajze sa zmenil.</b> Úpravy sú teraz zamknuté.</div>' : ''}
    <p class="muted" style="margin:8px 0 16px">Zapíšeš, čo máš doma, a jedálniček aj nákupný
      zoznam s tým rátajú. Zatiaľ skladáme plán len z akcií — o tvojej špajzi nevie.</p></div>
    <div class="card">
      <label>Pridať surovinu · zamknuté 🔒</label>
      <input placeholder="napr. ${esc(SPAJZA_UKAZKA.join(', '))}" disabled>
      <p class="muted" style="margin-top:10px">V bezplatnej verzii je zápis zamknutý —
        hneď, nie až pri ukladaní.</p>
    </div>
    ${uspana && ulozenych > 0 ? `<div class="hint">
      <span class="eyebrow">Tvoja špajza zostáva uložená</span>
      <p style="margin:6px 0 0">${esc(uspanaSprava)}</p>
    </div>` : `<div class="hint">
      <span class="eyebrow">Ukážka — nie tvoje údaje</span>
      <p style="margin:6px 0 12px">Povedzme, že doma máš toto —
        <b>${esc(SPAJZA_UKAZKA.join(', '))}</b>. Potom sa stanú dve veci:</p>
      <p class="mono" style="font-size:.72rem;font-weight:600;margin-bottom:6px">1 · Vypadnú z nákupného zoznamu</p>
      ${SPAJZA_UKAZKA.map(item => `<div class="item done"><span class="box">✓</span>
        <span class="nm">${esc(item)}</span>
        <span class="pr">${esc(SPAJZA_UKAZKA_CENY[item])} € · máš doma</span></div>`).join('')}
      <div class="save"><span class="mono" style="font-size:.74rem;font-weight:600">NÁKUP KLESNE O<br>
        24,90 € → 20,23 €</span><b>4,67 €</b></div>
      <p class="mono" style="font-size:.72rem;font-weight:600;margin:14px 0 6px">2 · Jedlá sa poskladajú okolo nich</p>
      <div class="meal"><div class="meal-h"><span class="meal-d">ST</span>
        <span class="meal-n">Rizoto z ryže a cibule</span>
        <span class="mono" style="font-size:.72rem;color:var(--ink-soft)">30 min</span></div>
        <div class="meal-b" style="display:block">
          ${SPAJZA_UKAZKA.map(item => ingredientRow({spajza: item})).join('')}
        </div></div>
      <p class="muted" style="margin-top:12px">Dokupuješ už len to, čo k tomu chýba — a to
        z akcií. Nekúpiš druhýkrát to, čo doma máš, a menej jedla skončí v koši.</p>
    </div>`}
    <p style="margin:16px 0 12px"><b>Premium</b> skladá jedálniček z toho, čo máš doma,
      a nákupný zoznam bez toho, čo už máš.</p>
    <button class="btn" id="sp-premium"${tlacidlo.zamknute}>${esc(tlacidlo.popis)}</button>
    ${poznamka}
    <p id="sp-err" class="muted" style="color:var(--red);margin-top:10px"></p>`;
  if (!platbyIdu) return;
  $('#sp-premium').onclick = () => runGuardedAction($('#sp-premium'), $('#sp-err'), async () => {
    const platba = await api('/api/platba/start', {method:'POST'});
    location.href = platba.url;
  });
}

function vSpajza() {
  if (!pantryUnlocked(ME)) return vSpajzaZamknuta();
  const sp = ME.spajza || [];
  M.innerHTML = `<div style="margin:18px 0 6px"><span class="eyebrow">Špajza</span>
    <h1 class="display" style="font-size:1.5rem;margin-top:4px">Čo už máš doma</h1>
    <p class="muted" style="margin:8px 0 6px">Ukladá sa hneď a sama za seba.
      Jedálniček sa tým nemení — v nákupnom zozname sa hneď odloží nabok to,
      čo už doma máš.</p>
    <p class="muted" style="margin:0 0 16px">Keď chceš aj jedlá poskladať okolo špajze,
      povedz si o to tlačidlom dole.</p></div>
    <div class="card"><label>Pridať surovinu</label>
      <div style="display:flex;gap:8px"><input id="sp-new" placeholder="napr. ${esc(SPAJZA_UKAZKA.join(', '))}">
      <button class="btn" style="width:auto;padding:14px 18px" id="sp-add">+</button></div>
      <p id="sp-err" class="muted" style="color:var(--red);margin-top:10px"></p></div>
    <div id="sp-list">${sp.map((s,i)=>`<div class="item"><span class="nm">${esc(s)}</span>
      <span class="pr" data-i="${i}" style="color:var(--red);cursor:pointer">✕</span></div>`).join('')
      || '<p class="muted center" style="padding:18px">Zatiaľ prázdna.</p>'}</div>
    <div style="height:16px"></div>
    <button class="btn btn--ghost" id="sp-navrhni"${sp.length ? '' : ' disabled'}>Navrhni jedlá z toho, čo mám doma →</button>
    <p class="muted center mono" style="font-size:.7rem;margin-top:8px">${sp.length
      ? 'Skladá sa 60 až 120 sekúnd a berie jeden prepočet z dnešného stropu.'
      : 'Najprv napíš, čo máš doma.'}</p>`;
  const uloz = list => runGuardedAction($('#sp-add'), $('#sp-err'), async () => {
    try {
      await api('/api/spajza', {method:'POST', body:JSON.stringify({polozky:list})});
    } catch (error) {
      if (error && error.status === 403 && error.code === 'spajza_premium') {
        ME = await api('/api/me');
        PANTRY_ACCESS_CHANGED = true;
        vSpajza();
        return;
      }
      throw error;
    }
    ME = await api('/api/me');
    PANTRY_HINT_HIDDEN = false;
    await refreshPlanAfterPantrySave();
    vSpajza();
  });
  $('#sp-add').onclick = () => {
    const v = $('#sp-new').value.trim(); if (!v) return;
    uloz([...(ME.spajza||[]), v]);
  };
  $('#sp-new').onkeydown = e => { if (e.key === 'Enter') $('#sp-add').click(); };
  $('#sp-navrhni').onclick = () => { if (!$('#sp-navrhni').disabled) navrhniZoSpajze(); };
  M.querySelectorAll('[data-i]').forEach(el => el.onclick = () => {
    const l = [...ME.spajza]; l.splice(+el.dataset.i, 1); uloz(l);
  });
}

function vNast() {
  const varenie = ME.frekvencia === 1 ? 'Varím každý deň' :
    'Varím raz za ' + ME.frekvencia + ' dni';
  M.innerHTML = `<div style="margin:18px 0 6px"><span class="eyebrow">Nastavenia</span>
    <h1 class="display" style="font-size:1.5rem;margin-top:4px">Tvoj profil</h1></div>
    <div class="card"><div class="ing"><span>E-mail</span><span class="r">${esc(ME.email)}</span></div>
      <div class="ing"><span>Varím pre</span><span class="r">${ME.osoby} os.</span></div>
      <div class="ing"><span>Varenie</span><span class="r">${varenie}</span></div>
      <div class="ing" style="border:0"><span>Obchody</span><span class="r">${ME.obchody.join(' · ')}</span></div>
    </div>
    <button class="btn btn--ghost" id="zmen">Zmeniť nastavenie</button>
    <div style="height:10px"></div>
    <button class="btn btn--ghost" id="odhl" style="color:var(--red)">Odhlásiť sa</button>
    <p id="nast-err" class="muted" style="color:var(--red);margin-top:10px"></p>`;
  $('#zmen').onclick = viewOnboarding;
  $('#odhl').onclick = () => runGuardedAction($('#odhl'), $('#nast-err'), async () => {
    await api('/api/auth/logout',{method:'POST'});
    location.reload();
  });
}

$('#nav').onclick = e => {
  if (!APP_READY) return;
  const b = e.target.closest('button'); if (!b) return;
  TAB = b.dataset.t; render();
};

/* ---------- štart ---------- */
function viewOffline(message) {
  $('#nav').classList.add('hidden');
  M.innerHTML = `<div class="card center" style="margin-top:40px">
    <div style="font-size:2.4rem">📡</div>
    <h2 class="display" style="font-size:1.4rem;margin:10px 0">Bez spojenia</h2>
    <p class="muted">${esc(message)}</p><div style="height:14px"></div>
    <button class="btn" id="znova">Skúsiť znova</button></div>`;
  $('#znova').onclick = () => { beginStartup(); start(); };
}

async function start() {
  /* Kto sa už raz prihlásil, uvidí hlavičku aj menu okamžite — čaká len na plán. */
  const known = paintKnownShell();
  M.innerHTML = known
    ? `<div class="spin"></div><p class="center muted mono" style="font-size:.8rem">Načítavam…</p>`
    : '<div class="spin"></div>';
  try { ME = await readStartupResponse(STARTUP.me); }
  catch(e) {
    if (e.offline) return viewOffline(e.message);
    return viewLogin();
  }
  if (!ME.prihlaseny) return viewLogin();
  setNavigationReady(true);
  $('#hdr').textContent = ME.email.split('@')[0];
  rememberProfile(ME);
  if (!ME.onboarding) return viewOnboarding();
  await nacitajPlan(false);
}

start();

/* Service worker musí sedieť v koreni webu, inak jeho scope končí na /static/
   a /app nikdy neovláda — preto PWA nemala offline škrupinu. Starú registráciu
   treba zrušiť menovite, sama by neodišla. */
if (navigator.serviceWorker && navigator.serviceWorker.getRegistrations) {
  navigator.serviceWorker.getRegistrations().then(registrations => {
    registrations.forEach(registration => {
      const script = (registration.active || registration.installing ||
        registration.waiting || {}).scriptURL || '';
      if (script.indexOf('/static/sw.js') !== -1) registration.unregister();
    });
  }).catch(()=>{});
}
if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(()=>{});
</script>
