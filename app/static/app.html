<script>
const $ = s => document.querySelector(s);
const M = $('#main');
let ME = null, PLAN = null, TAB = 'plan';
let AUTH_V3_ENABLED = false;

function authV3Enabled(me) {
  return !!me && me.auth_v3 === true;
}
let SECURITY_LOAD_GENERATION = 0;
let APP_READY = false;
let DONE = {};
let PANTRY_OVERRIDE = {};
let PANTRY_HINT_HIDDEN = false;
let PANTRY_ACCESS_CHANGED = false;
let PLAN_NOTE = '';
let PLAN_NEEDS_REGEN = false;
let PLAN_RESUME_ENDPOINT = '';
let PLAN_EMPTY_REASON = '';
const SPAJZA_UKAZKA = ['ryža', 'vajcia', 'cibuľa'];
const SPAJZA_UKAZKA_CENY = {'ryža': '1,29', 'vajcia': '2,49', 'cibuľa': '0,89'};
const PLAN_PREPARATION_MESSAGE = 'Plán pripravujeme. Pokojne pokračuj inde.';

function startupRequests(request) {
  return {me: request('/api/me'), plan: request('/api/plan')};
}

let STARTUP = null, PLAN_PREFETCH = null;

function beginStartup() {
  STARTUP = startupRequests(url =>
    fetch(url, {headers: {'Content-Type': 'application/json'}}));
  STARTUP.me.catch(() => {});
  STARTUP.plan.catch(() => {});
  PLAN_PREFETCH = STARTUP.plan;
  return STARTUP;
}

beginStartup();
function takePlanPrefetch() {
  const pending = PLAN_PREFETCH;
  PLAN_PREFETCH = null;
  return pending;
}

const PROFILE_KEY = 'uvarsi_profil';

function rememberProfile(me) {
  try {
    localStorage.setItem(PROFILE_KEY, JSON.stringify({onboarding: !!me.onboarding}));
  } catch (e) {}
}

function forgetProfile() {
  try { localStorage.removeItem(PROFILE_KEY); } catch (e) {}
}

function cachedProfile() {
  try {
    const raw = localStorage.getItem(PROFILE_KEY);
    if (raw === null) return null;
    const known = JSON.parse(raw);
    const onboarding = !!(known && known.onboarding);
    localStorage.setItem(PROFILE_KEY, JSON.stringify({onboarding}));
    return onboarding ? {onboarding: true} : null;
  } catch (e) {

    return null;
  }
}

function checkedStateKey(user, plan) {
  var identity = user && (user.id || user.email);
  var week = plan && plan.tyzden;
  var parts = [String(week || 'unknown')];
  var groups = (plan && plan.nakupny_zoznam) || [];
  for (var g = 0; g < groups.length; g++) {
    var group = groups[g] || {};
    parts.push(String(group.obchod || ''));
    var items = group.polozky || [];
    for (var i = 0; i < items.length; i++) {
      var item = items[i] || {};
      parts.push(String(item.offer_key || item.nazov || ''));
    }
  }
  var signature = parts.join('|');
  var fingerprint = 2166136261;
  for (var c = 0; c < signature.length; c++) {
    fingerprint = (fingerprint ^ signature.charCodeAt(c)) >>> 0;
    fingerprint = (fingerprint + ((fingerprint << 1) + (fingerprint << 4) +
      (fingerprint << 7) + (fingerprint << 8) + (fingerprint << 24))) >>> 0;
  }
  return 'uvarsi_done:' + encodeURIComponent(String(identity || 'unknown')) + ':' +
    encodeURIComponent(String(week || 'unknown')) + ':' + fingerprint.toString(36);
}

function loadCheckedState(user, plan) {
  try { return JSON.parse(localStorage.getItem(checkedStateKey(user, plan)) || '{}'); }
  catch(e) { return {}; }
}

function setPlan(plan) {

}

function pantryOverrideKey(user, plan) {

function loadPantryOverride(user, plan) {

function pantryOwned(item, overrides) {

function pantryPartial(item, overrides) {

function moneyValue(text) {
  var amount = Number(String(text == null ? '' : text).replace(',', '.'));
  return isFinite(amount) ? amount : 0;
}

function moneyText(amount) {
  return (isFinite(Number(amount)) ? Number(amount) : 0).toFixed(2).replace('.', ',');
}

function planTotals(plan) {
  plan = plan || {};
  var nakup = moneyValue(plan.nakup_spolu),
    bezna = plan.bezna_cena != null ? plan.bezna_cena : plan.bezne,
    usetris = plan.usetrene != null ? plan.usetrene : plan.usetris;
  if (bezna == null) bezna = nakup + moneyValue(usetris);
  if (usetris == null) usetris = Math.max(0, moneyValue(bezna) - nakup);
  return {nakup:moneyText(nakup), bezna:moneyText(moneyValue(bezna)), usetris:moneyText(moneyValue(usetris))};
}

function shoppingItems(plan) {

}

function remainingTotal(plan, overrides) {

    var id = String(item && (item.offer_key || item.nazov) || '');
    if ((overrides || {})[id]) return sum + moneyValue(item.cena);
    if (item && item.cena_po_spajzi != null) return sum + moneyValue(item.cena_po_spajzi);
    return pantryOwned(item, overrides) ? sum : sum + moneyValue(item.cena);
  }, 0));
}

function pantryOwnedCount(plan, overrides) {

function itemsWord(count) {

function apiErrorMessage(status, payload) {
  var detail = payload && payload.detail;
  if (Object.prototype.toString.call(detail) === '[object Array]') {
    var reasons = [];
    for (var i = 0; i < detail.length; i++) {
      var entry = detail[i];
      var reason = typeof entry === 'string' ? entry : (entry && (entry.msg || entry.message)) || '';
      if (reason) reasons.push(String(reason));
    }
    detail = reasons.join(' · ');
  } else if (detail && typeof detail === 'object') {
    detail = detail.msg || detail.message || '';
  }
  if (typeof detail === 'string' && detail.replace(/\s/g, '')) {
    detail = detail.trim();
    return /[.!?…]$/.test(detail) ? detail : detail + '.';
  }
  if (status === 422 || status === 400) return 'Zadané údaje nesedia. Skontroluj ich a skús to znova.';
  if (status === 404) return 'Toto sa nenašlo. Skús to znova alebo napíš na pomoc@uvar.si.';
  if (status === 429) return 'Priveľa pokusov za sebou. Skús to prosím o minútu.';
  if (status >= 500) return 'Server má krátkodobý problém. Skús to prosím o chvíľu znova.';
  return 'Niečo sa pokazilo. Skús to prosím znova.';
}

function networkErrorMessage(online) {
  return online === false
    ? 'Vyzerá to, že si offline. Zapni internet a skús to znova.'
    : 'Nepodarilo sa spojiť so serverom. Skontroluj pripojenie a skús to znova.';
}

function offlineError() {
  const failure = new Error(networkErrorMessage(
    typeof navigator === 'undefined' ? true : navigator.onLine));
  failure.offline = true;
  return failure;
}

async function readApiResponse(r) {
  if (handleApiUnauthorized(r)) {
    const authError = new Error('Prihlásenie vypršalo. Prihlás sa znova.');
    authError.authRequired = true;
    throw authError;
  }
  if (!r.ok) {
    const payload = await r.json().catch(()=>null);
    const failure = new Error(apiErrorMessage(r.status, payload));
    failure.status = r.status;
    const serverCode = payload && (payload.kod || payload.code);
    failure.code = typeof serverCode === 'string' ? serverCode.slice(0,100) : '';
    throw failure;
  }
  return r.json();
}

async function readStartupResponse(pending) {
  let r;
  try { r = await pending; }
  catch (networkFailure) { throw offlineError(); }
  return readApiResponse(r);
}

async function api(url, opts) {
  const options = Object.assign({headers:{'Content-Type':'application/json'}}, opts||{});
  let r;
  try {
    r = await fetch(url, options);
  } catch (networkError) {
    throw offlineError();
  }
  return readApiResponse(r);
}

function pantryName(value) {

function pantryDiffers(planPantry, currentPantry) {
  if (Object.prototype.toString.call(planPantry) !== '[object Array]') return false;
  var tidy = function(list) {
    var out = [];
    var source = Object.prototype.toString.call(list) === '[object Array]' ? list : [];
    for (var i = 0; i < source.length; i++) {
      var name = pantryName(source[i]);
      if (name) out.push(name);
    }
    return out.sort();
  };
  var before = tidy(planPantry), now = tidy(currentPantry);
  if (before.length !== now.length) return true;
  for (var i = 0; i < before.length; i++) if (before[i] !== now[i]) return true;
  return false;
}

function dayGenitive(day) {

  var key = String(day == null ? '' : day);
  return Object.prototype.hasOwnProperty.call(forms, key) ? forms[key] : 'predošlého dňa';
}

function planWeekDays(plan, frequency) {
  var dni = ['PO', 'UT', 'ST', 'ŠT', 'PI', 'SO', 'NE'];
  var meals = (plan && plan.jedla) || [];
  var map = {};
  for (var m = 0; m < meals.length; m++) if (meals[m] && meals[m].den) map[meals[m].den] = meals[m];
  var span = Math.round(Number(frequency));
  if (!isFinite(span) || span < 1) span = 1;
  if (span > 7) span = 7;
  var rows = [], cooked = null, since = 0;
  for (var i = 0; i < dni.length; i++) {
    var den = dni[i];
    if (map[den]) { cooked = den; since = 0; rows.push({den: den, typ: 'jedlo', jedlo: map[den]}); continue; }
    since += 1;
    if (cooked && since <= span - 1) rows.push({den: den, typ: 'zvysok', zdroj: cooked});
    else rows.push({den: den, typ: 'volno'});
  }
  return rows;
}

function weekLabel(tyzden) {
  var text = String(tyzden == null ? '' : tyzden).trim();
  var parts = /^(\d{4})-(\d{2})-(\d{2})$/.exec(text);
  if (!parts) return text ? 'Týždeň ' + text : 'Aktuálny týždeň';
  return 'Týždeň od ' + Number(parts[3]) + '. ' + Number(parts[2]) + '. ' + parts[1];
}
const esc = s => String(s??'').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function isoDay(value) {
  var parts = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(value == null ? '' : value).trim());
  if (!parts) return null;
  return Date.UTC(Number(parts[1]), Number(parts[2]) - 1, Number(parts[3]));
}

function dayMonthLabel(iso) {
  var parts = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(iso == null ? '' : iso).trim());
  return parts ? Number(parts[3]) + '. ' + Number(parts[2]) + '.' : '';
}

function offerValidity(validTo, today) {
  var end = isoDay(validTo), now = isoDay(today);
  if (end === null || now === null) return {stav: 'neznama', text: ''};
  var days = Math.round((end - now) / 86400000);
  if (days < 0) return {stav: 'neplatna', text: 'Cena už neplatí'};
  if (days === 0) return {stav: 'dnes', text: 'Platí len dnes'};
  if (days === 1) return {stav: 'zajtra', text: 'Platí do zajtra'};
  return {stav: 'plati', text: 'Platí do ' + dayMonthLabel(validTo)};
}

function leafletLabel(item) {

function sourceHref(url) {

function todayIso() {

  var pad = n => (n < 10 ? '0' : '') + n;
  return now.getFullYear() + '-' + pad(now.getMonth() + 1) + '-' + pad(now.getDate());
}

function ingredientProvenance(item, today) {

  if (href) parts.push(`<a href="${esc(href)}" target="_blank" rel="noopener noreferrer nofollow">Otvoriť leták ↗</a>`);
  return parts.length ? `<div class="prov">${parts.join('')}</div>` : '';
}

function ingredientRow(item, today) {

function passkeyUiAvailable(authEnabled, browser) {

function base64urlToBuffer(value) {
  if (typeof value !== 'string' || !value || !/^[A-Za-z0-9_-]+$/.test(value))
    throw new Error('Passkey údaje majú nesprávny formát.');
  const base64 = value.replace(/-/g, '+').replace(/_/g, '/');
  const binary = atob(base64 + '='.repeat((4 - base64.length % 4) % 4));
  const bytes = new Uint8Array(binary.length);
  for (let index = 0; index < binary.length; index += 1)
    bytes[index] = binary.charCodeAt(index);
  return bytes.buffer;
}

function bufferToBase64url(value) {
  let bytes;
  if (value instanceof ArrayBuffer) bytes = new Uint8Array(value);
  else if (ArrayBuffer.isView(value))
    bytes = new Uint8Array(value.buffer, value.byteOffset, value.byteLength);
  else throw new Error('Passkey údaje majú nesprávny formát.');
  let binary = '';
  for (let index = 0; index < bytes.length; index += 1)
    binary += String.fromCharCode(bytes[index]);
  return btoa(binary).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/g, '');
}

function prepareRegistrationOptions(options) {
  const prepared = Object.assign({}, options, {
    challenge: base64urlToBuffer(options.challenge),
    user: Object.assign({}, options.user, {id: base64urlToBuffer(options.user.id)})
  });
  prepared.excludeCredentials = (options.excludeCredentials || []).map(item =>
    Object.assign({}, item, {id: base64urlToBuffer(item.id)}));
  return prepared;
}

function prepareAuthenticationOptions(options) {
  const prepared = Object.assign({}, options, {
    challenge: base64urlToBuffer(options.challenge)
  });
  prepared.allowCredentials = (options.allowCredentials || []).map(item =>
    Object.assign({}, item, {id: base64urlToBuffer(item.id)}));
  return prepared;
}

function registrationCredentialJson(credential) {
  const response = credential.response;
  const transports = typeof response.getTransports === 'function'
    ? response.getTransports().filter(item =>
      ['ble', 'cable', 'hybrid', 'internal', 'nfc', 'smart-card', 'usb'].includes(item))
    : [];
  return {
    credential: {
      id: credential.id,
      rawId: bufferToBase64url(credential.rawId),
      type: credential.type,
      response: {
        clientDataJSON: bufferToBase64url(response.clientDataJSON),
        attestationObject: bufferToBase64url(response.attestationObject)
      },
      clientExtensionResults: typeof credential.getClientExtensionResults === 'function'
        ? credential.getClientExtensionResults() : {}
    },
    transports: transports
  };
}

function authenticationCredentialJson(credential) {
  const response = credential.response;
  return {
    id: credential.id,
    rawId: bufferToBase64url(credential.rawId),
    type: credential.type,
    response: {
      clientDataJSON: bufferToBase64url(response.clientDataJSON),
      authenticatorData: bufferToBase64url(response.authenticatorData),
      signature: bufferToBase64url(response.signature),
      userHandle: response.userHandle == null ? null : bufferToBase64url(response.userHandle)
    },
    clientExtensionResults: typeof credential.getClientExtensionResults === 'function'
      ? credential.getClientExtensionResults() : {}
  };
}

async function performPasskeyLogin(credentialsApi) {
  const options = await accountApi({
    url: '/api/auth/passkey/login/options',
    options: {method: 'POST', body: '{}'}
  });
  let assertion;
  try {
    assertion = await credentialsApi.get({
      publicKey: prepareAuthenticationOptions(options)
    });
  } catch (error) {
    if (error && (error.name === 'NotAllowedError' || error.name === 'AbortError'))
      throw new Error('Biometrické prihlásenie bolo zrušené. Heslom sa môžeš prihlásiť ďalej.');
    throw new Error('Biometrické prihlásenie sa nepodarilo. Heslom sa môžeš prihlásiť ďalej.');
  }
  if (!assertion)
    throw new Error('Biometrické prihlásenie bolo zrušené. Heslom sa môžeš prihlásiť ďalej.');
  return accountApi({
    url: '/api/auth/passkey/login/verify',
    options: {method: 'POST', body: JSON.stringify({
      challenge: options.challenge,
      credential: authenticationCredentialJson(assertion),
      device_name: 'Zariadenie s Passkey'
    })}
  });
}

async function performPasskeyRegistration(credentialsApi) {
  const options = await accountApi({
    url: '/api/auth/passkey/register/options',
    options: {method: 'POST', body: '{}'}
  });
  let credential;
  try {
    credential = await credentialsApi.create({
      publicKey: prepareRegistrationOptions(options)
    });
  } catch (error) {
    if (error && (error.name === 'NotAllowedError' || error.name === 'AbortError'))
      throw new Error('Pridanie Passkey bolo zrušené. Môžeš to skúsiť znova.');
    throw new Error('Passkey sa nepodarilo pridať. Skús to znova.');
  }
  if (!credential) throw new Error('Pridanie Passkey bolo zrušené. Môžeš to skúsiť znova.');
  const encoded = registrationCredentialJson(credential);
  return accountApi({
    url: '/api/auth/passkey/register/verify',
    options: {method: 'POST', body: JSON.stringify({
      challenge: options.challenge,
      credential: encoded.credential,
      transports: encoded.transports,
      name: 'Toto zariadenie'
    })}
  });
}

function authScreenHtml(mode, passkeyReady) {

    : isForgot

      : 'Prihlás sa e-mailom a heslom.';
  const action = isRegister ? 'Vytvoriť účet' : isForgot ? 'Poslať odkaz na obnovu' : 'Prihlásiť sa';
  return `<div class="auth-shell"><div class="auth-intro"><span class="eyebrow">Tvoj účet</span><h1 class="display auth-title" id="auth-title" tabindex="-1" style="font-size:2rem;margin:8px 0 10px">${title}</h1><p class="muted">${note}</p></div><fieldset class="auth-switcher"><legend class="sr-only">Vyber spôsob prístupu k účtu</legend><button class="auth-switch${switchMode === 'login' ? ' on' : ''}" id="auth-login-mode" type="button"${switchMode === 'login' ? ' aria-current="page"' : ''}>Prihlásiť sa</button><button class="auth-switch${switchMode === 'register' ? ' on' : ''}" id="auth-register-mode" type="button"${switchMode === 'register' ? ' aria-current="page"' : ''}>Vytvoriť účet</button></fieldset><form class="card" id="auth-form" novalidate><div class="auth-field"><label for="auth-email">E-mail</label><input id="auth-email" name="email" type="email" inputmode="email" autocomplete="email" required placeholder="tvoj@email.sk"></div> ${isForgot ? '' : `<div class="auth-field"><label for="auth-password">Heslo</label>
        <div class="password-field"><input id="auth-password" name="password" type="password" autocomplete="${isRegister ? 'new-password' : 'current-password'}" minlength="10" maxlength="128" required>
          <button class="password-toggle" id="auth-password-toggle" type="button" aria-pressed="false">Zobraziť heslo</button></div>
        ${isRegister ? '<p class="muted" style="margin-top:6px">Použi 10 až 128 znakov.</p>' : ''}</div>`} ${active === 'login' ? '<button class="auth-link" id="auth-forgot" type="button">Zabudol som heslo</button><div style="height:8px"></div>' : ''} ${active === 'login' ? '<button class="auth-link" id="auth-legacy-setup" type="button">Mám starý účet – nastaviť heslo</button>' : ''} ${isForgot ? '<button class="auth-link" id="auth-back" type="button">Späť na prihlásenie</button><div style="height:8px"></div>' : ''} <button class="btn" id="auth-submit" type="submit">${action}</button> ${active === 'login' && passkeyReady ? `<div class="auth-divider"><span>alebo</span></div>
        <button class="btn btn--ghost" id="auth-passkey" type="button">Prihlásiť biometriou</button>` : ''} <p class="muted auth-status" id="auth-status" role="status" aria-live="polite"></p></form></div>`;
}

function authRequest(mode, email, password) {
  const endpoints = {
    login: '/api/auth/login',
    register: '/api/auth/register',
    forgot: '/api/auth/password/request'
  };
  const payload = mode === 'forgot' ? {email: email} : {email: email, password: password};
  return {url: endpoints[mode], options: {method: 'POST', body: JSON.stringify(payload)}};
}

function legacySetupRequest(email) {
  return {url:'/api/auth/request',options:{method:'POST',
    body:JSON.stringify({email:email.trim()})}};
}

function passwordChangeRequest(old, next) {
  return {url:'/api/auth/password/change',options:{method:'POST',
    body:JSON.stringify({current_password:old,password:next})}};
}

async function accountApi(request) {
  const options = Object.assign(
    {headers: {'Content-Type': 'application/json'}}, request.options || {});
  let response;
  try {
    response = await fetch(request.url, options);
  } catch (error) {
    throw new Error('Nepodarilo sa pripojiť. Skontroluj internet a skús to znova.');
  }
  const payload = await response.json().catch(() => ({}));
  if (!response.ok) {
    const detail = payload && typeof payload.detail === 'string' ? payload.detail.trim() : '';
    throw new Error(detail || (response.status >= 500
      ? 'Server má krátkodobý problém. Skús to o chvíľu znova.'
      : 'Zadané údaje nesedia. Skontroluj ich a skús to znova.'));
  }
  return payload;
}

function togglePasswordVisibility(input, button) {
  const visible = input.type === 'password';
  input.type = visible ? 'text' : 'password';
  button.textContent = visible ? 'Skryť heslo' : 'Zobraziť heslo';
  button.setAttribute('aria-pressed', visible ? 'true' : 'false');
}

function viewAccountAuth(mode, previousEmail) {
  const active = mode === 'register' || mode === 'forgot' ? mode : 'login';
  const browser = typeof window === 'undefined' ? null : window;
  const passkeyReady = passkeyUiAvailable(AUTH_V3_ENABLED, browser);
  M.innerHTML = authScreenHtml(active, passkeyReady);
  if (previousEmail) $('#auth-email').value = previousEmail;
  $('#auth-login-mode').onclick = () => viewAccountAuth('login', $('#auth-email').value.trim());
  $('#auth-register-mode').onclick = () => viewAccountAuth('register', $('#auth-email').value.trim());
  const forgot = $('#auth-forgot');
  if (forgot) forgot.onclick = () => viewAccountAuth('forgot', $('#auth-email').value.trim());
  const back = $('#auth-back');
  if (back) back.onclick = () => viewAccountAuth('login', $('#auth-email').value.trim());
  const password = $('#auth-password');
  const toggle = $('#auth-password-toggle');
  const status = $('#auth-status');
  if (password && toggle) toggle.onclick = () => togglePasswordVisibility(password, toggle);
  const legacySetup = $('#auth-legacy-setup');
  if (legacySetup) legacySetup.onclick = () => runGuardedAction(
    legacySetup, status, async () => {
      const email = $('#auth-email').value.trim();
      if (!email) throw new Error('Zadaj e-mailovú adresu.');
      await accountApi(legacySetupRequest(email));
      status.style.color = 'var(--success)';
      status.textContent = 'Ak účet existuje, odkaz je na ceste.';
      legacySetup.textContent = 'Skontroluj e-mail';
    });
  const passkey = $('#auth-passkey');
  if (passkey) passkey.onclick = () => runGuardedAction(passkey, status, async () => {
    const result = await performPasskeyLogin(navigator.credentials);
    location.replace(result.redirect || '/app');
  });
  $('#auth-title').focus();
  $('#auth-form').onsubmit = event => {
    event.preventDefault();
    const button = $('#auth-submit');
    const email = $('#auth-email').value.trim();
    const secret = password ? password.value : '';
    runGuardedAction(button, status, async () => {
      if (!email) throw new Error('Zadaj e-mailovú adresu.');
      if (active !== 'forgot' && (secret.length < 10 || secret.length > 128))
        throw new Error('Heslo musí mať 10 až 128 znakov.');
      const request = authRequest(active, email, secret);
      const result = await accountApi(request);
      if (active === 'login') {
        location.replace(result.redirect || '/app');
        return;
      }
      status.style.color = 'var(--success)';
      status.textContent = active === 'register'
        ? 'Žiadosť je prijatá. V e-maile výslovne potvrď vytvorenie účtu.'
        : 'Ak účet existuje, odkaz na obnovu hesla je na ceste.';
      button.textContent = active === 'register' ? 'Skontroluj e-mail' : 'E-mail je na ceste';
    });
  };
}

function viewLogin(sent, previousEmail) {

function householdLabel(profil) {
  profil = profil || {};
  const a = +(profil.adults == null ? profil.osoby || 4 : profil.adults), c = +(profil.children || 0);
  const word = (n, one, few, many) => n === 1 ? one : n < 5 ? few : many;
  return [a && `${a} ${word(a,'dospelý','dospelí','dospelých')}`,
    c && `${c} ${word(c,'dieťa','deti','detí')}`].filter(Boolean).join(' + ');
}

    !!(me && me.premium && me.recipe_engine === 'on');
}

function dietOptionsHtml(selected, premium, recipeEngine) {
  var choices = [
    ['standard', 'Bez obmedzenia'], ['high_protein', 'Viac bielkovín'],
    ['vegetarian', 'Vegetariánsky'], ['vegan', 'Vegánsky']

  return `<div class="diet-grid" id="c-diet" role="group" aria-labelledby="lbl-diet">${choices.map(function(choice) {
    var active = choice[0] === selected;
    var locked = choice[0] !== 'standard' && !premium;

    return `<button class="diet-choice${active ? ' on' : ''}" type="button" data-mode="${choice[0]}" aria-pressed="${active ? 'true' : 'false'}"${locked ? ' aria-disabled="true" disabled' : ''}>${esc(choice[1])}${tag}</button>`;

function selectDietMode(root, mode) {
  if (!root || ['standard','high_protein','vegetarian','vegan'].indexOf(mode) < 0) return false;
  var buttons = root.querySelectorAll('[data-mode]');

  for (var i = 0; i < buttons.length; i++) {
    var active = buttons[i].dataset.mode === mode;
    buttons[i].classList.toggle('on', active);
    buttons[i].setAttribute('aria-pressed', active ? 'true' : 'false');
  }
  return true;
}

    obchody:stores};

}

let PLAN_REQUEST_IN_FLIGHT = null;
let PLAN_PREPARATION = null;
let PLAN_FAILURE = null;
let PLAN_POLL_TIMER = null;
let PLAN_POLL_IN_FLIGHT = null;
let PLAN_CONTEXT_VERSION = 0;

function onePlanRequest(request) {
  if (PLAN_REQUEST_IN_FLIGHT) return PLAN_REQUEST_IN_FLIGHT;
  PLAN_REQUEST_IN_FLIGHT = request().finally(() => { PLAN_REQUEST_IN_FLIGHT = null; });
  return PLAN_REQUEST_IN_FLIGHT;
}

function requestPlan(kind, url) {
  if (PLAN_PREPARATION) return Promise.resolve(PLAN_PREPARATION.response);
  const version = PLAN_CONTEXT_VERSION;
  const options = arguments[2] || {method:'POST'};
  return onePlanRequest(async () => {
    const response = await api(url, options);
    if (version !== PLAN_CONTEXT_VERSION) return {stale:true, plan_version:version};
    if (response && response.status === 'preparing') {
      setPlanPreparation(response, kind, version);
    }
    return response;
  });
}

function stopPlanPolling() {
  if (PLAN_POLL_TIMER) { clearTimeout(PLAN_POLL_TIMER); PLAN_POLL_TIMER = null; }
}

function startPlanPolling() {
  stopPlanPolling();
  if (!PLAN_PREPARATION) return;
  if (typeof document !== 'undefined' && document.visibilityState !== 'visible') return;
  PLAN_POLL_TIMER = setTimeout(pollPlanStatus, 4000);
}

function setPlanPreparation(response) {
  const kind = arguments[1] || 'regular';
  const version = arguments[2] == null ? PLAN_CONTEXT_VERSION : arguments[2];
  if (!response || response.status !== 'preparing' || version !== PLAN_CONTEXT_VERSION) return false;
  PLAN_PREPARATION = {response:response, jobId:response.job_id, kind:kind};
  PLAN_FAILURE = null;
  PLAN_NOTE = '';
  startPlanPolling();
  return true;
}

function setPlanFailure(response, kind, version) {
  if (version !== PLAN_CONTEXT_VERSION) return false;
  stopPlanPolling();
  PLAN_PREPARATION = null;
  PLAN_FAILURE = response || {};
  PLAN_FAILURE.kind = kind;
  const serverMessage = response && response.message;
  PLAN_FAILURE.message = serverMessage || 'Plán sa nepodarilo pripraviť. Skús to znova.';
  return true;
}

function invalidatePlanState() {
  PLAN_CONTEXT_VERSION += 1;
  stopPlanPolling();
  PLAN_PREPARATION = null;
  PLAN_FAILURE = null;
}

function currentPlanPreparation(preparation, version) {
  return PLAN_PREPARATION && PLAN_PREPARATION.jobId === preparation.jobId &&
    version === PLAN_CONTEXT_VERSION;
}

async function pollPlanStatus() {
  if (!PLAN_PREPARATION) return;
  if (typeof document !== 'undefined' && document.visibilityState !== 'visible') return;
  if (PLAN_POLL_IN_FLIGHT) return;
  const preparation = PLAN_PREPARATION;
  const version = PLAN_CONTEXT_VERSION;
  const request = {preparation:preparation, version:version};
  PLAN_POLL_IN_FLIGHT = request;
  try {
    const response = await api('/api/plan');
    if (!currentPlanPreparation(preparation, version)) return;
    if (response && response.status === 'preparing') return;
    if (response && response.status === 'failed') {
      setPlanFailure(response, preparation.kind, version);
      render();
      return;
    }
    if (response && response.jedla) {
      let me = null;
      try { me = await api('/api/me'); } catch (ignored) {}
      if (!currentPlanPreparation(preparation, version)) return;
      stopPlanPolling();
      PLAN_PREPARATION = null;
      setPlan(response);
      if (me) ME = me;
      render();
      return;
    }
    stopPlanPolling();
    PLAN_PREPARATION = null;
    setPlan(null);
    PLAN_NEEDS_REGEN = true;
    render();
  } catch (error) {
    if (currentPlanPreparation(preparation, version)) {
      setPlanFailure({message:(error && error.message) ||
        'Nepodarilo sa skontrolovať prípravu plánu. Skús to znova.', retry_allowed:true},
        preparation.kind, version);
      render();
    }
  } finally {
    if (PLAN_POLL_IN_FLIGHT === request) PLAN_POLL_IN_FLIGHT = null;
    if (PLAN_PREPARATION &&
        (typeof document === 'undefined' || document.visibilityState === 'visible')) {
      startPlanPolling();
    }
  }
}

if (typeof document !== 'undefined') document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') startPlanPolling();
  else stopPlanPolling();
});

function generujPlan() {
  return requestPlan('regular', '/api/plan/generuj', {method:'POST'});
}

function preskladajPlan() {
  return requestPlan('force', '/api/plan/generuj?force=1', {method:'POST'});
}

function regenerationsLeft(me) {
  var raw = me ? me.zostava_prepoctov : null;
  if (typeof raw !== 'number' && typeof raw !== 'string') return null;
  var left = Math.round(Number(raw));
  return isFinite(left) && String(raw).trim() ? Math.max(0, left) : null;
}

function nextDayLabel(today) {
  var base = isoDay(today);
  if (base === null) return 'zajtra';
  var next = new Date(base + 86400000);
  return 'zajtra ' + next.getUTCDate() + '. ' + (next.getUTCMonth() + 1) + '.';
}

function regenerationBlockedNote(me, today) {
  var limit = Math.round(Number(me && me.limit_prepoctov));
  var kolko = isFinite(limit) && limit > 0
    ? (limit === 1 ? 'raz za deň' : limit + '× za deň') : '';
  var text = kolko
    ? 'Nový jedálniček ide ' + kolko + ' a dnešok už máš vyčerpaný.'
    : 'Nový jedálniček dnes už nejde.';
  text += ' Ďalší si vyžiadaj ' + nextDayLabel(today) +
    ' po polnoci — ten, ktorý máš teraz, ti zostáva.';
  if (!(me && me.premium)) text += ' S Premium je to 5× denne.';
  return text;
}

function regenerationNote(me) {
  var limit = Math.round(Number(me && me.limit_prepoctov));
  if (!isFinite(limit) || limit <= 0) return '';
  var left = Math.round(Number(me && me.zostava_prepoctov));
  if (!isFinite(left) || left < 0) left = 0;
  return 'Nový jedálniček: dnes ešte ' + Math.min(left, limit) + ' z ' + limit;
}

function planZoSpajze() {
  return requestPlan('pantry', '/api/plan/zo-spajze', {method:'POST'});
}

async function navrhniZoSpajze() {
  TAB = 'plan';
  if (regenerationsLeft(ME) === 0) {
    PLAN_NOTE = regenerationBlockedNote(ME, todayIso());
    return render();
  }
  const version = PLAN_CONTEXT_VERSION;
  try {
    const response = await planZoSpajze();
    if (response && response.stale) return;
    if (response && response.status === 'preparing') return render();
    if (response && response.status === 'failed') {
      setPlanFailure(response, 'pantry', PLAN_CONTEXT_VERSION);
      return render();
    }
    setPlan(response);
    PLAN_NOTE = '';
    PANTRY_HINT_HIDDEN = true;
    try {
      const me = await api('/api/me');
      if (version === PLAN_CONTEXT_VERSION) ME = me;
    } catch (ignored) {}
  } catch (error) {
    if (error && error.authRequired) return;
    PLAN_NOTE = (error && error.message) ||
      'Jedálniček zo špajze sa teraz nepodaril. Skús to prosím znova.';
  }
  render();
}

function portionLine(recept) {
  if (!recept) return '';
  var parts = [];
  var portions = Math.round(Number(recept.porcie));
  if (isFinite(portions) && portions > 0) {
    var word = portions === 1 ? 'porcia' : portions < 5 ? 'porcie' : 'porcií';
    parts.push(portions + ' ' + word);
  }
  var composition = typeof ME !== 'undefined' && ME ? householdLabel(ME) : '';
  var forWhom = String(recept.pre == null ? '' : recept.pre).trim();
  if (composition) {
    parts.push(composition);
    var days = Math.round(Number(recept.dni));
    if (!isFinite(days) || days < 1) {
      var match = forWhom.match(/[×x]\s*(\d+)\s*(?:deň|dni|dní)\s*$/i);
      days = match ? +match[1] : 0;
    }
    if (days) parts.push('na ' + days + ' ' + (days === 1 ? 'deň' : days < 5 ? 'dni' : 'dní'));
  } else if (forWhom) parts.push('pre ' + forWhom);
  return parts.join(' · ');
}

function recipeFactsHtml(recept) {
  recept = recept || {};
  var protein = Number(recept.nutrition && recept.nutrition.serving &&
    recept.nutrition.serving.protein_g);
  var facts = [];
  if (isFinite(protein) && protein > 0)
    facts.push(`<span>Odhad: ${Math.round(protein)} g bielkovín na dospelú porciu</span>`);
  if (recept.high_protein_claim === true)
    facts.push('<span class="protein-claim">Vysoký obsah bielkovín</span>');
  var map = {milk:'mlieko',egg:'vajcia',fish:'ryby',soy:'sója',gluten:'lepok',wheat:'lepok',
    peanuts:'arašidy',nuts:'škrupinové plody',celery:'zeler',mustard:'horčica',sesame:'sezam'};
  var seen = {}, names = [];
  (Array.isArray(recept.allergens) ? recept.allergens : []).forEach(function(value) {
    var key = String(value == null ? '' : value).trim().toLowerCase();
    var name = map[key] || key;
    if (name && !seen[name]) { seen[name] = true; names.push(name); }
  });
  var html = facts.length ? `<div class="recipe-facts">${facts.join('')}</div>` : '';

  return html;
}

async function novyPlan() {
  if (!PLAN || !PLAN.jedla) return nacitajPlan(true);
  if (regenerationsLeft(ME) === 0) {
    PLAN_NOTE = regenerationBlockedNote(ME, todayIso());
    return render();
  }
  const version = PLAN_CONTEXT_VERSION;
  try {
    const response = await preskladajPlan();
    if (response && response.stale) return;
    if (response && response.status === 'preparing') return render();
    if (response && response.status === 'failed') {
      setPlanFailure(response, 'force', PLAN_CONTEXT_VERSION);
      return render();
    }
    setPlan(response);
    PLAN_NOTE = '';
    try {
      const me = await api('/api/me');
      if (version === PLAN_CONTEXT_VERSION) ME = me;
    } catch (ignored) {}
  } catch (error) {
    if (error && error.authRequired) return;
    PLAN_NOTE = (error && error.message) || 'Nový jedálniček sa teraz nepodaril. Skús to prosím znova.';
  }
  render();
}

async function nacitajPlan(gen) {
  const version = PLAN_CONTEXT_VERSION;
  if (!gen) M.innerHTML = loadingSkeletonHtml('Načítavam jedálniček…');
  try {
    const prefetched = gen ? null : takePlanPrefetch();
    let plan = gen ? await generujPlan()
      : (prefetched ? await readStartupResponse(prefetched) : await api('/api/plan'));
    if (version !== PLAN_CONTEXT_VERSION) return;
    if (plan && plan.stale) return;
    if (plan && plan.status === 'preparing') {
      if (!PLAN_PREPARATION) setPlanPreparation(plan, 'regular', version);
      return render();
    }
    if (plan && plan.status === 'failed') {
      setPlanFailure(plan, 'regular', version);
      return render();
    }
    if (plan.prazdny && plan.vyzaduje_akciu) {
      setPlan(null);
      PLAN_NEEDS_REGEN = true;
      PLAN_RESUME_ENDPOINT = plan.obnovit_cez || '/api/plan/generuj';
      return render();
    }
    if (plan.prazdny) {
      plan = await generujPlan();
      if (plan && plan.stale) return;
      if (plan && plan.status === 'preparing') return render();
    }
    setPlan(plan);
  } catch(e) {
    if (e.authRequired) return;
    showNav();
    M.innerHTML = `<div class="card center" style="margin-top:30px"><span class="eyebrow">Plán sa nepodaril</span><p style="margin-top:8px">${esc(e.message)}</p><div style="height:14px"></div><button class="btn" onclick="nacitajPlan(true)">Skúsiť znova</button><div style="height:10px"></div><button class="btn btn--ghost" id="plan-err-nast">Zmeniť obchody v nastaveniach</button><div style="height:10px"></div><button class="btn btn--ghost" id="plan-err-spajza">Otvoriť špajzu</button><p class="muted" style="margin-top:12px;font-size:.82rem">Dole v menu sa dostaneš aj na Špajzu a na Ja.</p></div>`;
    $('#plan-err-nast').onclick = () => { TAB = 'nastavenia'; render(); };
    $('#plan-err-spajza').onclick = () => { TAB = 'spajza'; render(); };
    return;
  }
  render();
}

async function retryPlanPreparation() {
  if (!PLAN_FAILURE) return nacitajPlan(true);

  const kind = PLAN_FAILURE.kind;
  PLAN_FAILURE = null;
  if (kind === 'pantry') return navrhniZoSpajze();
  if (kind === 'force') return novyPlan();
  return nacitajPlan(true);
}

function pantryItemFromFields(name, amount, unit, allowLegacy) {
  var clean = String(name == null ? '' : name).trim().replace(/\s+/g, ' ');
  if (!clean || clean.length > 80) throw new Error('Názov suroviny musí mať 1 až 80 znakov.');
  var raw = String(amount == null ? '' : amount).trim().replace(',', '.');
  if (!raw && allowLegacy) return {nazov:clean, mnozstvo:null, jednotka:null};
  var value = Number(raw), aliases = {g:'g',ml:'ml',ks:'piece',piece:'piece'};
  var canonical = aliases[String(unit == null ? '' : unit).trim().toLowerCase()];
  if (!isFinite(value) || value <= 0) throw new Error('Doplň kladné množstvo.');
  if (!canonical) throw new Error('Vyber g, ml alebo ks.');
  var limit = canonical === 'piece' ? 10000 : 100000;
  if (value >= limit) throw new Error('Množstvo je príliš vysoké.');
  return {nazov:clean, mnozstvo:value, jednotka:canonical};
}

var PANTRY_EDITOR_SEQUENCE = 0;

function nextPantryEditorId() {
  PANTRY_EDITOR_SEQUENCE += 1;
  return 'pantry-editor-' + PANTRY_EDITOR_SEQUENCE;
}

function pantryRowHtml(item, index) {
  if (typeof item === 'string') item = {nazov:item,mnozstvo:null,jednotka:null};
  item = item || {nazov:'',mnozstvo:null,jednotka:null};
  var legacy = item.mnozstvo == null || item.jednotka == null;
  var unit = item.jednotka === 'piece' ? 'ks' : item.jednotka || 'g';
  var amount = legacy ? '' : String(item.mnozstvo);
  var measure = legacy ? 'Doplň množstvo' : esc(amount + ' ' + unit);
  var editorId = nextPantryEditorId();
  return `<div class="pantry-shelf" data-pantry-row data-legacy="${legacy ? 'true' : 'false'}"><div class="pantry-row-main"><span class="pantry-name">${esc(item.nazov)}</span><span class="pantry-measure">${measure}</span><span class="pantry-actions"><button type="button" class="quiet-action sp-edit" aria-expanded="false" aria-controls="${editorId}">Upraviť</button><button type="button" class="quiet-action quiet-action--danger sp-remove">Odstrániť</button></span></div><div class="pantry-row-editor" id="${editorId}" hidden><label class="pf pf-name">Názov<input class="sp-row-name" maxlength="80" value="${esc(item.nazov)}"></label><label class="pf">Množstvo<input class="sp-row-amount" type="number" min="0" step="any" inputmode="decimal" value="${esc(amount)}" placeholder="množstvo"></label><label class="pf">Jednotka<select class="sp-row-unit">${['g','ml','ks'].map(function(value){return `<option${unit === value ? ' selected' : ''}>${value}</option>`;}).join('')}</select></label></div></div>`;
}

function leftoverPantryItem(item) {
  if (!item || !pantryName(item)) return null;
  var raw = item.zostava != null && String(item.zostava).trim() ? item.zostava
    : item.zostane_po_spajzi != null && String(item.zostane_po_spajzi).trim()
      ? item.zostane_po_spajzi : item.zostane;
  var match = /^\s*(\d+(?:[.,]\d+)?)\s*(g|kg|ml|l|ks|piece)\s*$/i.exec(String(raw == null ? '' : raw).replace(/\u00a0/g,' '));
  if (!match) return null;
  var amount = Number(match[1].replace(',','.')), unit = match[2].toLowerCase();
  if (!isFinite(amount) || amount <= 0) return null;
  if (unit === 'kg') { amount *= 1000; unit = 'g'; }
  if (unit === 'l') { amount *= 1000; unit = 'ml'; }
  if (unit === 'ks') unit = 'piece';
  return {nazov:pantryName(item), mnozstvo:amount, jednotka:unit};
}

function leftoverButtonHtml(item, key, done, pantryAvailable) {

function toggleShoppingDone(key) {

  vZoznam();
  return DONE[key];

function mergePantryItem(items, incoming) {
  var list = (Array.isArray(items) ? items : []).map(function(item) {
    return typeof item === 'string' ? {nazov:item,mnozstvo:null,jednotka:null} : Object.assign({},item);
  });
  if (!incoming) return list;
  for (var i = 0; i < list.length; i++) {
    if (pantryName(list[i]) === pantryName(incoming) && list[i].jednotka === incoming.jednotka &&
        isFinite(Number(list[i].mnozstvo)) && Number(list[i].mnozstvo) > 0) {
      list[i].nazov = pantryName(list[i]);
      list[i].mnozstvo = Number(list[i].mnozstvo) + Number(incoming.mnozstvo);
      return list;
    }
  }
  list.push(Object.assign({},incoming));
  return list;
}

async function savePantryList(list) {
  try {
    await api('/api/spajza', {method:'POST', body:JSON.stringify({polozky:list})});
  } catch (error) {
    if (error && error.status === 403 && error.code === 'spajza_premium') {
      ME = await api('/api/me');
      PANTRY_ACCESS_CHANGED = true;
      if (typeof vSpajza === 'function') vSpajza();
      return false;
    }
    throw error;
  }
  ME = await api('/api/me');
  PANTRY_HINT_HIDDEN = false;
  await refreshPlanAfterPantrySave();
  return true;
}

async function addLeftoverToPantry(button, item) {
  if (!button || button.disabled) return false;
  var incoming = leftoverPantryItem(item);
  if (!incoming) return false;
  var label = button.textContent, errorNode = $('#shop-error');
  button.disabled = true;
  button.textContent = 'Pridávam…';
  if (errorNode) errorNode.textContent = '';
  try {
    var saved = await savePantryList(mergePantryItem(ME && ME.spajza, incoming));
    if (!saved) return false;
    button.textContent = 'Pridané do špajze';
    vZoznam();
    return true;
  } catch (error) {
    button.disabled = false;
    button.textContent = label;
    if (errorNode) errorNode.textContent = error && error.message || 'Zvyšok sa nepodarilo pridať. Skús to znova.';
    return false;
  }
}

function passwordSetupDismissalKey(me) {
  const userId = me && me.id;
  return userId === undefined || userId === null || userId === ''
    ? '' : 'uvarsi.password-setup-dismissed.v1:' + String(userId);
}

function dismissPasswordSetup(me, storage) {
  const key = passwordSetupDismissalKey(me);
  if (!key || !storage) return false;
  try { storage.setItem(key, '1'); return true; }
  catch (error) { return false; }
}

function passwordSetupCard(me, storage) {
  if (!authV3Enabled(me)) return '';
  const key = passwordSetupDismissalKey(me);
  if (me.password_configured !== false) {
    if (key && storage) {
      try { storage.removeItem(key); } catch (error) {}
    }
    return '';
  }
  if (key && storage) {
    try { if (storage.getItem(key) === '1') return ''; } catch (error) {}
  }
  return `<section class="card setup-card" id="password-setup-card"><span class="eyebrow">Zabezpečenie účtu</span><h2 class="display" style="font-size:1.25rem;margin:7px 0">Nastaviť heslo</h2><p class="muted">Tvoje prihlásenie ostáva aktívne. Heslo si môžeš doplniť teraz alebo neskôr.</p><div class="setup-actions"><a class="btn" href="/api/auth/pages/heslo">Nastaviť heslo</a><button class="auth-link" id="skip-password-setup" type="button">Pokračovať bez nastavenia</button></div></section>`;
}

function deviceRevocationRequest(session) {
  const identifier = session && session.management_id;
  if (typeof identifier !== 'string' || !/^[A-Za-z0-9_-]{20,128}$/.test(identifier)) return null;
  return {
    url: '/api/auth/sessions/' + encodeURIComponent(identifier),
    options: {method: 'DELETE'},
    logsOutCurrent: session.current === true
  };
}

function passkeyDeletionRequest(passkey) {
  const identifier = passkey && passkey.credential_id;
  if (typeof identifier !== 'string' ||
      !/^[A-Za-z0-9_-]{1,2048}$/.test(identifier)) return null;
  return {
    url: '/api/auth/passkeys/' + encodeURIComponent(identifier),
    options: {method: 'DELETE'}
  };
}

function securityDateLabel(timestamp) {
  const value = Number(timestamp);
  if (!Number.isFinite(value)) return '';
  try {
    return new Intl.DateTimeFormat('sk-SK', {
      day: 'numeric', month: 'short', year: 'numeric'
    }).format(new Date(value * 1000));
  } catch (error) { return ''; }
}

function securityPanelHtml(passkeyReady, passkeys, sessions, state) {
  const loading = state && state.loading;
  const passkeyError = state && state.passkeyError ? String(state.passkeyError) : '';
  const sessionError = state && state.sessionError ? String(state.sessionError) : '';
  const listedPasskeys = Object.prototype.toString.call(passkeys) === '[object Array]'
    ? passkeys : [];
  const listedSessions = Object.prototype.toString.call(sessions) === '[object Array]'
    ? sessions : [];
  const passkeyRows = listedPasskeys.map(item => {
    const name = item && item.name ? item.name : 'Passkey';
    const used = securityDateLabel(item && (item.last_used_at || item.created_at));
    return `<div class="security-row"><span class="security-copy"><span class="security-name">${esc(name)}</span><span class="security-meta">${used ? 'Použitý alebo pridaný ' + esc(used) : 'Pridaný Passkey'}</span></span><button class="btn btn--ghost" type="button" data-passkey-delete="${esc(item.credential_id)}" aria-label="Odstrániť Passkey ${esc(name)}">Odstrániť</button></div>`;
  }).join('');
  const sessionRows = listedSessions.map(item => {
    const name = item && item.device_name ? item.device_name : 'Zariadenie';
    const seen = securityDateLabel(item && item.last_seen_at);
    const current = item && item.current === true;
    return `<div class="security-row"><span class="security-copy"><span class="security-name">${esc(name)}${current ? '<span class="security-current">Toto zariadenie</span>' : ''}</span><span class="security-meta">${seen ? 'Aktívne ' + esc(seen) : 'Aktívna relácia'}</span></span><button class="btn btn--ghost" type="button" data-session-revoke="${esc(item.management_id)}" aria-label="${current ? 'Odhlásiť toto zariadenie' : 'Odhlásiť zariadenie ' + esc(name)}">${current ? 'Odhlásiť toto zariadenie' : 'Odhlásiť zariadenie'}</button></div>`;
  }).join('');
  return `<section class="card" aria-labelledby="passkey-security-title"><span class="eyebrow">Prihlásenie</span><h2 class="display security-title" id="passkey-security-title" tabindex="-1" style="font-size:1.25rem;margin:7px 0">Biometria a Passkey</h2><p class="muted">Biometrická kontrola ostáva v zariadení. Uvar.si na serveri ukladá iba verejné poverenie Passkey.</p> ${passkeyReady ? '<div class="security-actions"><button class="btn btn--ghost" id="passkey-add" type="button">Pridať biometriu/Passkey</button></div>' : ''} <div class="security-list" aria-label="Tvoje Passkey">${loading ? '<p class="muted">Načítavam Passkey…</p>' : passkeyError ? '<p class="muted" style="color:var(--accent)">Passkey sa nepodarilo načítať.</p>' : passkeyRows || '<p class="muted">Zatiaľ nemáš pridaný Passkey.</p>'}</div></section><section class="card" aria-labelledby="device-security-title"><span class="eyebrow">Relácie</span><h2 class="display security-title" id="device-security-title" tabindex="-1" style="font-size:1.25rem;margin:7px 0">Tvoje zariadenia</h2><p class="muted">Odhlás zariadenie, ktoré už nepoužívaš. Identifikátory v tomto zozname nie sú prihlasovacie údaje.</p><div class="security-list" aria-label="Prihlásené zariadenia">${loading ? '<p class="muted">Načítavam zariadenia…</p>' : sessionError ? '<p class="muted" style="color:var(--accent)">Zariadenia sa nepodarilo načítať.</p>' : sessionRows || '<p class="muted">Nenašli sa aktívne zariadenia.</p>'}</div> ${!sessionError && listedSessions.length > 1 ? '<div class="security-actions"><button class="btn btn--ghost" id="sessions-logout-others" type="button">Odhlásiť ostatné zariadenia</button></div>' : ''} </section> ${passkeyError || sessionError ? '<button class="auth-link" id="security-retry" type="button">Skúsiť načítať znova</button>' : ''}`;
}

function securityStatusHtml() {
  return '<p class="muted auth-status" id="security-status" role="status" aria-live="polite" aria-atomic="true"></p>';
}

function bindSecurityControls(passkeys, sessions) {
  const status = $('#security-status');
  const retry = $('#security-retry');
  if (retry) retry.onclick = () => loadAccountSecurity('', '#passkey-security-title');
  const add = $('#passkey-add');
  if (add) add.onclick = () => runGuardedAction(add, status, async () => {
    await performPasskeyRegistration(navigator.credentials);
    await loadAccountSecurity('Passkey bol pridaný.', '#passkey-add');
  });
  M.querySelectorAll('[data-passkey-delete]').forEach(button => button.onclick = () => {
    const item = passkeys.find(candidate =>
      candidate.credential_id === button.dataset.passkeyDelete);
    const request = passkeyDeletionRequest(item);
    if (!request || !confirm('Odstrániť tento Passkey? Heslo bude naďalej fungovať.')) return;
    return runGuardedAction(button, status, async () => {
      await api(request.url, request.options);
      await loadAccountSecurity('Passkey bol odstránený.', '#passkey-security-title');
    });
  });
  M.querySelectorAll('[data-session-revoke]').forEach(button => button.onclick = () => {
    const item = sessions.find(candidate =>
      candidate.management_id === button.dataset.sessionRevoke);
    const request = deviceRevocationRequest(item);
    const question = request && request.logsOutCurrent
      ? 'Odhlásiť toto zariadenie? Potom sa budeš musieť znova prihlásiť.'
      : 'Odhlásiť vybrané zariadenie?';
    if (!request || !confirm(question)) return;
    return runGuardedAction(button, status, async () => {
      await api(request.url, request.options);
      if (request.logsOutCurrent) {
        location.replace('/app');
        return;
      }
      await loadAccountSecurity('Zariadenie bolo odhlásené.', '#device-security-title');
    });
  });
  const logoutOthers = $('#sessions-logout-others');
  if (logoutOthers) logoutOthers.onclick = () => {
    if (!confirm('Odhlásiť všetky ostatné zariadenia? Toto zariadenie ostane prihlásené.')) return;
    return runGuardedAction(logoutOthers, status, async () => {
      await api('/api/auth/sessions/logout-others', {method: 'POST', body: '{}'});
      await loadAccountSecurity('Ostatné zariadenia boli odhlásené.', '#device-security-title');
    });
  };
}

async function loadAccountSecurity(notice, focusTarget) {
  const root = $('#account-security');
  const content = $('#account-security-content');
  const status = $('#security-status');
  if (!root || !content || !status) return false;
  const generation = ++SECURITY_LOAD_GENERATION;
  const browser = typeof window === 'undefined' ? null : window;
  const passkeyReady = passkeyUiAvailable(AUTH_V3_ENABLED, browser);
  const values = await Promise.allSettled([
    api('/api/auth/passkeys'), api('/api/auth/sessions')
  ]);
  if (generation !== SECURITY_LOAD_GENERATION ||
      $('#account-security') !== root ||
      $('#account-security-content') !== content ||
      $('#security-status') !== status) return false;
  if (values.some(result => result.status === 'rejected' &&
      result.reason && result.reason.authRequired)) return false;

  const passkeyResult = values[0];
  const sessionResult = values[1];
  const passkeys = passkeyResult.status === 'fulfilled' && passkeyResult.value &&
    Object.prototype.toString.call(passkeyResult.value.passkeys) === '[object Array]'
    ? passkeyResult.value.passkeys : [];
  const sessions = sessionResult.status === 'fulfilled' && sessionResult.value &&
    Object.prototype.toString.call(sessionResult.value.sessions) === '[object Array]'
    ? sessionResult.value.sessions : [];
  const passkeyError = passkeyResult.status === 'rejected'
    ? (passkeyResult.reason && passkeyResult.reason.message) || 'Neznáma chyba.' : '';
  const sessionError = sessionResult.status === 'rejected'
    ? (sessionResult.reason && sessionResult.reason.message) || 'Neznáma chyba.' : '';

  content.innerHTML = securityPanelHtml(passkeyReady, passkeys, sessions, {
    passkeyError: passkeyError, sessionError: sessionError
  });
  const announcements = [];
  if (notice) announcements.push(String(notice));
  if (passkeyError) announcements.push('Passkey sa nepodarilo načítať: ' + passkeyError);
  if (sessionError) announcements.push('Zariadenia sa nepodarilo načítať: ' + sessionError);
  status.textContent = announcements.join(' ');
  status.style.color = passkeyError || sessionError
    ? 'var(--accent)' : notice ? 'var(--success)' : '';
  bindSecurityControls(passkeys, sessions);

  if (focusTarget) {
    let target = $(focusTarget);
    if (!target && focusTarget.indexOf('passkey') >= 0)
      target = $('#passkey-security-title');
    if (!target && focusTarget.indexOf('device') >= 0)
      target = $('#device-security-title');
    if (target && typeof target.focus === 'function') target.focus();
  }
  return true;
}

function viewOffline(message) {
  $('#nav').classList.add('hidden');
  M.innerHTML = `<div class="card center" style="margin-top:40px"><svg class="state-icon" aria-hidden="true"><use href="#i-offline"></use></svg><h2 class="display" style="font-size:1.4rem;margin:10px 0">Bez spojenia</h2><p class="muted">${esc(message)}</p><div style="height:14px"></div><button class="btn" id="znova">Skúsiť znova</button></div>`;
  $('#znova').onclick = () => { beginStartup(); start(); };
}

async function start() {
  invalidatePlanState();
  const known = paintKnownShell();
  M.innerHTML = loadingSkeletonHtml(known ? 'Načítavam tvoj jedálniček…' : 'Načítavam…');
  try { ME = await readStartupResponse(STARTUP.me); }
  catch(e) {
    if (e.offline) return viewOffline(e.message);
    return viewLogin();
  }
  AUTH_V3_ENABLED = authV3Enabled(ME);
  if (!ME.prihlaseny) return viewLogin();
  setNavigationReady(true);
  $('#hdr').textContent = ME.email.split('@')[0];
  rememberProfile(ME);
  if (!ME.onboarding) return viewOnboarding();
  await nacitajPlan(false);
}

start();

if (navigator.serviceWorker && navigator.serviceWorker.getRegistrations) {
  navigator.serviceWorker.getRegistrations().then(registrations => {
    registrations.forEach(registration => {
      const script = (registration.active || registration.installing ||
        registration.waiting || {}).scriptURL || '';
      if (script.indexOf('/static/sw.js') !== -1) registration.unregister();
    });
  }).catch(()=>{});
}
if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(()=>{});
</script>
